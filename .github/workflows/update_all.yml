name: Actualizar datos Mi Índice DGI

on:
  schedule:
    # Precios diarios — lunes a viernes, cierre Europa y cierre EEUU
    - cron: '0 16 * * 1-5'
    - cron: '0 22 * * 1-5'
    # Fundamentales — domingos 6:00 UTC
    - cron: '0 6 * * 0'
    # ETFs y fondos — primer domingo de cada mes (12:00 UTC)
    - cron: '0 12 * * 0'
  workflow_dispatch:
    inputs:
      job:
        description: 'Qué job ejecutar'
        required: true
        default: 'prices'
        type: choice
        options: [prices, fundamentals, funds, all]

# ── JOB 1: Precios diarios y tipos de cambio ────────────────────────────────
jobs:
  update_prices:
    name: Precios diarios y tipos de cambio
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'prices' || github.event.inputs.job == 'all')) ||
      (github.event_name == 'schedule' && (github.event.schedule == '0 16 * * 1-5' || github.event.schedule == '0 22 * * 1-5'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Actualizar precios
        run: python scripts/update_prices.py --days 2
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Solo FX si el paso anterior falla
        if: failure()
        run: python scripts/update_prices.py --fx-only --days 2
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

# ── JOB 2: Fundamentales (domingos 6:00 UTC) ────────────────────────────────
  update_fundamentals:
    name: Fundamentales
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'fundamentals' || github.event.inputs.job == 'all')) ||
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 0')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Actualizar fundamentales
        run: python scripts/update_fundamentals.py
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TWELVEDATA_API_KEY:        ${{ secrets.TWELVEDATA_API_KEY }}

# ── JOB 3: ETFs y fondos (primer domingo de cada mes) ───────────────────────
  update_funds:
    name: ETFs y fondos
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'funds' || github.event.inputs.job == 'all')) ||
      (github.event_name == 'schedule' && github.event.schedule == '0 12 * * 0')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Actualizar ETFs y fondos
        run: python scripts/update_funds.py
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENFIGI_API_KEY:          ${{ secrets.OPENFIGI_API_KEY }}
