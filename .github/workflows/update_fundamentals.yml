name: Actualizar fundamentales

on:
  schedule:
    - cron: '0 6 * * 0'   # Cada domingo a las 6:00 UTC
  workflow_dispatch:        # Ejecución manual desde GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6 horas máximo (~2000 tickers × 2s ≈ 67 min reales)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: webapp/scripts/requirements.txt

      - name: Instalar dependencias
        run: pip install -r webapp/scripts/requirements.txt

      - name: Ejecutar script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python webapp/scripts/update_fundamentals.py

      - name: Notificar fallo
        if: failure()
        run: |
          echo "::error::El script update_fundamentals.py ha fallado. Revisa los logs del job."
