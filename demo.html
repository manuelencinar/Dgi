function getCountry(c){return COUNTRIES.find(x=>x.code===c)||{code:"OTHER",flag:"🌍",name:"Otro"};}
function sC(s){if(s==null)return"#3a4260";if(s>=8)return"#34d399";if(s>=6.5)return"#86efac";if(s>=5)return"#fbbf24";if(s>=3)return"#f97316";return"#f87171";}
function sBg(s){if(s==null)return"rgba(42,48,69,0.4)";if(s>=8)return"rgba(52,211,153,0.13)";if(s>=6.5)return"rgba(134,239,172,0.1)";if(s>=5)return"rgba(251,191,36,0.1)";if(s>=3)return"rgba(249,115,22,0.1)";return"rgba(248,113,113,0.1)";}
function sL(s){if(!s)return"Sin datos";if(s>=8)return"Excelente";if(s>=6.5)return"Buena";if(s>=5)return"Aceptable";if(s>=3)return"Débil";return"Muy débil";}
function rC(r,t){const top=Math.ceil(t*0.25),bot=Math.floor(t*0.75);if(r<=top)return"#34d399";if(r>bot)return"#f87171";return"#c8d0e0";}
function gM(sec){return(SECTORS[sec]||SECTORS.general).metrics;}
function cS(vals,sec){const ms=gM(sec);let tot=0,cnt=0;const sc={};ms.forEach(m=>{const v=vals[m.id];if(v!==undefined&&v!==""){const s=m.score(v);if(s!==null){sc[m.id]=s;tot+=s;cnt++;}}});return{scores:sc,total:cnt>0?tot/cnt:0,count:cnt};}
function calcDCF(cf,g1,g2,disc,term){
  const r=disc/100,tg=Math.min((term||2.5)/100,r-0.02);
  if(!cf||r<=0||r<=tg)return null;
  let iv=0,fl=parseFloat(cf);const a=g1/100,b=(g2!=null?g2:Math.max(g1/2,2))/100;
  for(let i=1;i<=5;i++){fl*=(1+a);iv+=fl/Math.pow(1+r,i);}
  for(let i=1;i<=5;i++){const gf=b-(b-tg)*(i/5);fl*=(1+gf);iv+=fl/Math.pow(1+r,5+i);}
  iv+=fl*Math.min(1/(r-tg),20)/Math.pow(1+r,10);return parseFloat(iv.toFixed(2));
}
function calcDDM(dps,g,d){const gr=g/100,dr=d/100;if(!dps||dr<=gr||dr<=0)return null;return parseFloat((dps*(1+gr)/(dr-gr)).toFixed(2));}
function autoG(vals,sec){const c=DCF_CFG[sec]||DCF_CFG.general;if(!c.cid)return null;const v=parseFloat(vals[c.cid]);return isNaN(v)?null:v;}
function getWHT(country){return WHT_DEFAULTS[country]||0;}
// Net dividend after double taxation (origin credited against destination)
function netYield(grossYield,originWHT,destWHT){
  // When dest >= origin: pays origin at source, then pays remaining (dest-origin) locally
  // When origin > dest: loses the excess — effective rate = origin
  const effective=Math.max(originWHT,destWHT)/100;
  return parseFloat((grossYield*(1-effective)).toFixed(4));
}
// 10-year projection: returns array of {year, grossDiv, netDiv, cumNet}
function project10y(investAmt,yieldPct,growthPct,originWHT,destWHT){
  if(!investAmt||!yieldPct)return null;
  const y=yieldPct/100,g=growthPct/100;
  const effective=Math.max(originWHT,destWHT)/100;
  const rows=[];let cumNet=0;
  for(let i=0;i<10;i++){
    const gross=investAmt*y*Math.pow(1+g,i);
    const net=gross*(1-effective);
    cumNet+=net;
    rows.push({year:i+1,gross:parseFloat(gross.toFixed(2)),net:parseFloat(net.toFixed(2)),cum:parseFloat(cumNet.toFixed(2))});
  }
  return rows;
}

function parseDivHistory(events){
  if(!events)return null;
  const byYear={};
  Object.values(events).forEach(ev=>{
    const yr=new Date(ev.date*1000).getFullYear();
    byYear[yr]=(byYear[yr]||0)+ev.amount;
  });
  return Object.entries(byYear)
    .map(([yr,dps])=>({year:parseInt(yr),dps:parseFloat(dps.toFixed(3))}))
    .sort((a,b)=>a.year-b.year).slice(-6);
}
function calcCAGR5(history){
  if(!history||history.length<2)return null;
  const valid=history.filter(h=>h.dps>0);
  if(valid.length<2)return null;
  const first=valid[0],last=valid[valid.length-1],yrs=last.year-first.year;
  if(yrs<=0)return null;
  return parseFloat(((Math.pow(last.dps/first.dps,1/yrs)-1)*100).toFixed(1));
}
async function fetchYahoo(ticker){
  const enc=encodeURIComponent;
  const url="https://query1.finance.yahoo.com/v8/finance/chart/"+enc(ticker)+"?interval=1d&range=1d";
  for(const px of[u=>"https://corsproxy.io/?"+u,u=>"https://api.allorigins.win/get?url="+enc(u)]){
    try{
      const r=await fetch(px(url),{signal:AbortSignal.timeout(12000)});
      if(!r.ok)continue;
      let j=await r.json();
      if(typeof j.contents==="string")j=JSON.parse(j.contents);
      const m=j?.chart?.result?.[0]?.meta;
      if(m?.regularMarketPrice)return{price:m.regularMarketPrice,currency:m.currency??"",updated:new Date().toLocaleString("es-ES")};
    }catch(e){}
  }
  throw new Error("No se pudo obtener precio para "+ticker);
}

// ─── RADAR ───────────────────────────────────────────────────────────────────
function RadarChart({scores,sector,color,size=220}){
  const ms=gM(sector),n=ms.length,cx=120,cy=120,r=82;
  const pt=(i,rad)=>{const a=(Math.PI*2*i/n)-Math.PI/2;return[cx+rad*Math.cos(a),cy+rad*Math.sin(a)];};
  const poly=ms.map((_,i)=>{const[x,y]=pt(i,(scores[ms[i].id]||0)/10*r);return x+","+y;}).join(" ");
  return(
    <svg viewBox="0 0 240 240" style={{width:"100%",maxWidth:size,display:"block",margin:"0 auto"}}>
      {[2,4,6,8,10].map(l=><polygon key={l} points={Array.from({length:n},(_,i)=>pt(i,l/10*r).join(",")).join(" ")} fill="none" stroke="rgba(255,255,255,0.05)" strokeWidth="1"/>)}
      {Array.from({length:n},(_,i)=>{const[x,y]=pt(i,r);return<line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke="rgba(255,255,255,0.06)" strokeWidth="1"/>;})}
      <polygon points={poly} fill={color} fillOpacity="0.15" stroke={color} strokeWidth="2"/>
      {ms.map((m,i)=>{const[x,y]=pt(i,r+14);return<text key={i} x={x} y={y} textAnchor="middle" dominantBaseline="middle" fontSize="7" fill="#4a5270" fontFamily="Figtree,sans-serif">{m.short}</text>;})}
      {ms.map((m,i)=>{const[x,y]=pt(i,(scores[m.id]||0)/10*r);return<circle key={i} cx={x} cy={y} r="2.5" fill={color}/>;})}
    </svg>
  );
}

// ─── CONCENTRATION CHART ─────────────────────────────────────────────────────
function ConcentrationChart({groups,getLabel,getColor}){
  const entries=Object.entries(groups).sort((a,b)=>b[1].length-a[1].length);
  const total=entries.reduce((s,[,v])=>s+v.length,0);
  if(total===0)return null;
  return(
    <div style={{marginBottom:18,padding:"12px 14px",background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.05)",borderRadius:12}}>
      <div style={{display:"flex",height:7,borderRadius:4,overflow:"hidden",gap:1,marginBottom:8}}>
        {entries.map(([k,v])=><div key={k} style={{width:(v.length/total*100)+"%",background:getColor(k)||"#818cf8",opacity:0.7,minWidth:2}}/>)}
      </div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {entries.map(([k,v])=>{const lb=getLabel(k),col=getColor(k)||"#818cf8";return(
          <div key={k} style={{display:"flex",alignItems:"center",gap:4,fontSize:10,color:"#5a6480"}}>
            <div style={{width:7,height:7,borderRadius:2,background:col}}/>{lb.flag&&<span>{lb.flag}</span>}<span>{lb.name}</span>
            <span style={{color:col,fontWeight:700}}>{v.length} ({(v.length/total*100).toFixed(0)}%)</span>
          </div>
        );})}
      </div>
    </div>
  );
}

// ─── 10-YEAR PROJECTION CHART ────────────────────────────────────────────────
function ProjectionChart({rows,investAmt}){
  if(!rows||!rows.length)return null;
  const maxVal=Math.max(...rows.map(r=>r.cum),investAmt||1);
  const W=300,H=140,PT=14,PB=28,PL=36,PR=8;
  const cW=W-PL-PR,cH=H-PT-PB,n=rows.length;
  const bW=Math.floor(cW/n*0.55),gap=(cW-bW*n)/(n+1);
  const payback=rows.findIndex(r=>r.cum>=investAmt);
  const ticks=[0,Math.round(maxVal/2),Math.round(maxVal)];
  return(
    <div>
      <svg viewBox={"0 0 "+W+" "+H} style={{width:"100%",display:"block"}}>
        {ticks.map(t=>{
          const y=PT+cH-(t/maxVal)*cH;
          return(
            <React.Fragment key={t}>
              <line x1={PL} y1={y} x2={W-PR} y2={y} stroke="rgba(255,255,255,0.05)" strokeWidth="1"/>
              <text x={PL-3} y={y+3} textAnchor="end" fontSize="8" fill="#3a4260" fontFamily="Figtree,sans-serif">{t>=1000?Math.round(t/100)/10+"k":t}</text>
            </React.Fragment>
          );
        })}
        {/* Investment line */}
        {investAmt&&investAmt<=maxVal&&(()=>{const y=PT+cH-(investAmt/maxVal)*cH;return<line key="inv" x1={PL} y1={y} x2={W-PR} y2={y} stroke="rgba(251,191,36,0.5)" strokeWidth="1" strokeDasharray="4 3"/>;})()}
        {rows.map((r,i)=>{
          const x=PL+gap+(bW+gap)*i;
          const hGross=Math.max((r.gross/maxVal)*cH,2),hNet=Math.max((r.net/maxVal)*cH,2);
          const hCum=Math.max((r.cum/maxVal)*cH,2);
          const isPB=payback===i;
          return(
            <React.Fragment key={i}>
              <rect x={x} y={PT+cH-hGross} width={bW} height={hGross} fill="rgba(255,255,255,0.1)" rx="2"/>
              <rect x={x} y={PT+cH-hNet} width={bW} height={hNet} fill={isPB?"#fbbf24":"#34d399"} opacity="0.8" rx="2"/>
              <text x={x+bW/2} y={H-PB+9} textAnchor="middle" fontSize="7" fill={isPB?"#fbbf24":"#4a5270"} fontFamily="Figtree,sans-serif">{r.year}</text>
            </React.Fragment>
          );
        })}
        {/* Cumulative line */}
        <polyline points={rows.map((r,i)=>{const x=PL+gap+(bW+gap)*i+bW/2,y=PT+cH-(r.cum/maxVal)*cH;return x+","+y;}).join(" ")} fill="none" stroke="#818cf8" strokeWidth="1.5" strokeDasharray="3 2"/>
      </svg>
      <div style={{display:"flex",gap:12,flexWrap:"wrap",fontSize:10,marginTop:4}}>
        <div style={{display:"flex",alignItems:"center",gap:4}}><div style={{width:10,height:10,background:"rgba(255,255,255,0.1)",borderRadius:2}}/><span style={{color:"#6a7090"}}>Bruto</span></div>
        <div style={{display:"flex",alignItems:"center",gap:4}}><div style={{width:10,height:10,background:"#34d399",borderRadius:2}}/><span style={{color:"#34d399"}}>Neto</span></div>
        <div style={{display:"flex",alignItems:"center",gap:4}}><div style={{width:10,height:3,background:"#818cf8",borderRadius:1}}/><span style={{color:"#818cf8"}}>Acumulado neto</span></div>
        {investAmt&&<div style={{display:"flex",alignItems:"center",gap:4}}><div style={{width:10,height:2,background:"rgba(251,191,36,0.6)",borderRadius:1}}/><span style={{color:"#fbbf24"}}>Inversión inicial</span></div>}
      </div>
    </div>
  );
}

// ─── DCF SECTION ─────────────────────────────────────────────────────────────
function DCFSection({form,setForm,metrics,live}){
  const cfg=DCF_CFG[form.sector]||DCF_CFG.general;
  const di=form.dcf||{cf:"",discount:"10",terminal:"2.5",price:"",growth2:""};
  const ag=autoG(form.values,form.sector);
  function sd(p){setForm(f=>({...f,dcf:{...(f.dcf||{}), ...p}}));}
  function run(){
    const cf=parseFloat(di.cf),disc=parseFloat(di.discount||10),term=parseFloat(di.terminal||2.5),pr=parseFloat(di.price);
    const g=ag??parseFloat(di.growth??0),g2=parseFloat(di.growth2||Math.max((g||0)/2,2).toFixed(1));
    if(!cf||isNaN(g))return;
    const iv=calcDCF(cf,g,g2,disc,term);if(!iv)return;
    const mos=pr>0?parseFloat(((iv-pr)/iv*100).toFixed(1)):null;
    setForm(f=>({...f,dcf:{...(f.dcf||{}),cf:di.cf,discount:di.discount,terminal:di.terminal,price:di.price,growth2:String(g2),iv,mos},values:{...f.values,margin_safety:mos!=null?String(mos):""}}));
  }
  const s=live.scores.margin_safety,hasMos=form.values.margin_safety!=null&&form.values.margin_safety!=="";
  return(
    <div style={{padding:"12px",background:"rgba(99,102,241,0.04)",border:"1px solid "+(hasMos?sC(s)+"40":"rgba(99,102,241,0.2)"),borderRadius:12,marginTop:8}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <div><span style={{fontSize:13,color:"#818cf8",fontWeight:600}}>DCF — 2 fases</span><p style={{fontSize:10,color:"#3a4260",marginTop:2}}>{cfg.lbl} <strong style={{color:"#c8d0e0"}}>por acción</strong>, no el total</p></div>
        {hasMos&&<div style={{fontSize:22,fontWeight:800,color:sC(s)}}>{parseFloat(form.values.margin_safety)>0?"+":""}{form.values.margin_safety}%</div>}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
        <div><label style={LBL}>{cfg.lbl}</label><input style={INP} type="number" step="any" placeholder="ej: 1.20" value={di.cf} onChange={e=>sd({cf:e.target.value})}/></div>
        <div><label style={LBL}>Precio actual</label><input style={INP} type="number" step="any" placeholder="ej: 12.50" value={di.price} onChange={e=>sd({price:e.target.value})}/></div>
        <div><label style={LBL}>Tasa descuento %</label><input style={INP} type="number" step="0.1" value={di.discount||"10"} onChange={e=>sd({discount:e.target.value})}/></div>
        <div><label style={LBL}>Crec. terminal %</label><input style={INP} type="number" step="0.1" value={di.terminal||"2.5"} onChange={e=>sd({terminal:e.target.value})}/></div>
      </div>
      {ag!=null?<React.Fragment><p style={{fontSize:11,color:"#4a5270",marginBottom:4}}>Fase 1 CAGR: <strong style={{color:"#c8d0e0"}}>{ag}%</strong></p><div style={{marginBottom:8}}><label style={LBL}>Fase 2 crec. años 6-10% (sugerido: {Math.max((ag||0)/2,2).toFixed(1)}%)</label><input style={INP} type="number" step="0.1" placeholder={String(Math.max((ag||0)/2,2).toFixed(1))} value={di.growth2||""} onChange={e=>sd({growth2:e.target.value})}/></div></React.Fragment>
      :<div style={{marginBottom:8}}><label style={LBL}>Crecimiento proyectado %</label><input style={INP} type="number" step="0.1" placeholder="ej: 7" value={di.growth||""} onChange={e=>sd({growth:e.target.value})}/></div>}
      <button onClick={run} style={{...BTN,width:"100%",background:"rgba(99,102,241,0.25)",color:"#818cf8",fontSize:12,marginBottom:di.iv?8:0}}>↻ Calcular valor intrínseco</button>
      {di.iv&&<div style={{display:"flex",justifyContent:"space-between",padding:"10px 14px",background:sBg(s),borderRadius:9}}><div><p style={{fontSize:10,color:"#4a5270"}}>Valor intrínseco</p><p style={{fontSize:20,fontWeight:800,color:"#fff"}}>{di.iv}</p></div>{di.mos!=null&&<div style={{textAlign:"right"}}><p style={{fontSize:10,color:"#4a5270"}}>Margen seguridad</p><p style={{fontSize:20,fontWeight:800,color:sC(s)}}>{di.mos>0?"+":""}{di.mos}%</p></div>}</div>}
      {(form.sector==="banco"||form.sector==="aseguradora")&&(
        <div style={{marginTop:10,padding:"10px",background:"rgba(96,165,250,0.04)",border:"1px solid rgba(96,165,250,0.2)",borderRadius:10}}>
          <p style={{fontSize:12,color:"#60a5fa",fontWeight:600,marginBottom:6}}>DDM — Dividend Discount Model</p>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:8}}>
            {[["ddmDps","DPS próx. año","0.80"],["ddmG","Crec. div. %","5"],["ddmR","Tasa desc. %","10"]].map(([k,lbl,ph])=>(
              <div key={k}><label style={LBL}>{lbl}</label><input style={{...INP,fontSize:12,padding:"6px 8px"}} type="number" step="any" placeholder={ph} value={di[k]||""} onChange={e=>sd({[k]:e.target.value})}/></div>
            ))}
          </div>
          {di.ddmDps&&di.ddmG&&di.ddmR&&(()=>{
            const iv2=calcDDM(parseFloat(di.ddmDps),parseFloat(di.ddmG),parseFloat(di.ddmR));
            const pr=parseFloat(di.price||0),mos2=iv2&&pr>0?parseFloat(((iv2-pr)/iv2*100).toFixed(1)):null;
            if(!iv2)return<p style={{fontSize:11,color:"#f87171"}}>Tasa descuento debe ser mayor que crecimiento</p>;
            return<div style={{display:"flex",justifyContent:"space-between",padding:"8px 12px",background:"rgba(96,165,250,0.08)",borderRadius:8}}><div><p style={{fontSize:10,color:"#4a5270"}}>Valor intrínseco DDM</p><p style={{fontSize:18,fontWeight:800,color:"#60a5fa"}}>{iv2}</p></div>{mos2!=null&&<div style={{textAlign:"right"}}><p style={{fontSize:10,color:"#4a5270"}}>Margen seguridad</p><p style={{fontSize:18,fontWeight:800,color:sC(mos2>20?8:mos2>0?6:mos2>-20?4:2)}}>{mos2>0?"+":""}{mos2}%</p></div>}</div>;
          })()}
        </div>
      )}
    </div>
  );
}

// ─── FORM ─────────────────────────────────────────────────────────────────────
function Form({initial,editingId,onSave,onCancel,destWHT}){
  const[form,setForm]=React.useState(()=>({...initial}));
  const[openH,setOpenH]=React.useState(null);
  const[showR,setShowR]=React.useState(null);
  const[showProj,setShowProj]=React.useState(false);
  const ms=React.useMemo(()=>gM(form.sector),[form.sector]);
  const live=React.useMemo(()=>cS(form.values,form.sector),[form.values,form.sector]);
  const sc=SECTORS[form.sector]||SECTORS.general;
  function applyDict(d){setForm(f=>({...f,name:d.name,ticker:d.ticker,country:d.country,sector:d.sector,_superSector:d.superSector,_sectorName:d.sectorName,_currency:d.currency,originWHT:getWHT(d.country)}));}
  function chSec(s){if(s!==form.sector)setForm(f=>({...f,sector:s,values:{}}));}
  const sV=(id,v)=>setForm(f=>({...f,values:{...f.values,[id]:v}}));
  // Projection
  const yld=parseFloat(form.values?.yield_pct)||0;
  const cagr=parseFloat(form.values?.div_cagr5)||0;
  const originWHT=form.originWHT!=null?form.originWHT:getWHT(form.country||"US");
  const dest=destWHT||19;
  const realisticCagr=Math.min(parseFloat((cagr*0.85).toFixed(2)),9);
  const projRows=React.useMemo(()=>yld>0?project10y(1000,yld,realisticCagr,originWHT,dest):null,[yld,realisticCagr,originWHT,dest]);
  const netY=yld>0?netYield(yld,originWHT,dest).toFixed(2):null;
  return(
    <div style={{background:"rgba(255,255,255,0.025)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:16,padding:"18px 16px"}}>
      <p style={{fontSize:10,color:"#4a5270",letterSpacing:"0.16em",textTransform:"uppercase",fontWeight:600,marginBottom:12}}>{editingId?"Editando":"Nueva empresa"}</p>
      {!editingId&&<CompanySearch onSelect={applyDict}/>}
      {form._sectorName&&<div style={{padding:"6px 10px",background:"rgba(99,102,241,0.06)",borderRadius:8,marginBottom:10,fontSize:11,color:"#818cf8"}}>{form._superSector} › {form._sectorName} · {form._currency}</div>}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
        <div><label style={LBL}>Nombre</label><input style={INP} placeholder="ej: Munich Re" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/></div>
        <div><label style={LBL}>Ticker</label><input style={INP} placeholder="ej: MUV2" value={form.ticker} onChange={e=>setForm(f=>({...f,ticker:e.target.value}))}/></div>
      </div>
      <div style={{marginBottom:10}}>
        <label style={LBL}>País</label>
        <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
          {COUNTRIES.map(ct=><button key={ct.code} onClick={()=>setForm(f=>({...f,country:ct.code,originWHT:getWHT(ct.code)}))} style={{...BTN,padding:"4px 8px",fontSize:10,background:form.country===ct.code?"rgba(99,102,241,0.4)":"rgba(255,255,255,0.04)",color:form.country===ct.code?"#fff":"#5a6480",border:"1px solid "+(form.country===ct.code?"rgba(99,102,241,0.5)":"rgba(255,255,255,0.06)"),borderRadius:7}}>{ct.flag} {ct.name}</button>)}
        </div>
      </div>
      <div style={{marginBottom:10}}>
        <label style={LBL}>Sector</label>
        <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
          {Object.entries(SECTORS).map(([k,s])=><button key={k} onClick={()=>chSec(k)} style={{...BTN,padding:"6px 12px",fontSize:11,background:form.sector===k?s.color+"25":"rgba(255,255,255,0.04)",color:form.sector===k?s.color:"#5a6480",border:"1px solid "+(form.sector===k?s.color+"50":"rgba(255,255,255,0.06)"),borderRadius:8}}>{s.label}</button>)}
        </div>
        <p style={{fontSize:11,color:"#3a4260",marginTop:4,fontStyle:"italic"}}>{sc.desc}</p>
      </div>
      <div style={{marginBottom:12}}>
        <label style={LBL}>Tesis de inversión</label>
        <textarea style={{...INP,height:56,resize:"vertical",lineHeight:1.4,fontSize:12}} placeholder="¿Por qué esta empresa?" value={form.thesis||""} onChange={e=>setForm(f=>({...f,thesis:e.target.value}))}/>
      </div>
      {/* DPS input */}
      <div style={{marginBottom:12,padding:"10px 12px",background:"rgba(52,211,153,0.04)",border:"1px solid rgba(52,211,153,0.15)",borderRadius:10}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,alignItems:"end"}}>
          <div>
            <label style={{...LBL,color:"#34d399"}}>Dividendo por acción (DPS)</label>
            <input style={INP} type="number" step="any" placeholder="ej: 5.42 €/acción/año"
              value={form.dps||""} onChange={e=>setForm(f=>({...f,dps:e.target.value}))}/>
            <p style={{fontSize:10,color:"#3a4260",marginTop:3}}>Suma anual de todos los pagos por acción</p>
          </div>
          <div>
            {form.dps&&parseFloat(form.dps)>0&&form.liveData?.price?(
              <div style={{padding:"8px",background:"rgba(52,211,153,0.1)",borderRadius:8,textAlign:"center"}}>
                <p style={{fontSize:9,color:"#4a5270"}}>Yield calculado</p>
                <p style={{fontSize:20,fontWeight:800,color:"#34d399"}}>{(parseFloat(form.dps)/form.liveData.price*100).toFixed(2)}%</p>
                <p style={{fontSize:9,color:"#3a4260"}}>a €{form.liveData.price.toFixed(2)}</p>
              </div>
            ):form.dps&&parseFloat(form.dps)>0?(
              <div style={{padding:"8px",background:"rgba(251,191,36,0.08)",borderRadius:8,textAlign:"center"}}>
                <p style={{fontSize:9,color:"#fbbf24"}}>Sin precio en directo</p>
                <p style={{fontSize:10,color:"#4a5270",marginTop:2}}>Refresca Yahoo Finance o introduce el precio en el DCF para calcular el yield</p>
              </div>
            ):null}
          </div>
        </div>
      </div>
      {/* Manual DPS history */}
      {(()=>{
        const hist=form.divHistory||[];
        const curYear=new Date().getFullYear();
        const recentYears=Array.from({length:5},(_,i)=>curYear-4+i);
        const olderYears=(hist||[]).map(h=>h.year).filter(y=>y<curYear-4).sort((a,b)=>a-b);
        const years=recentYears;
        const cagr=calcCAGR5(hist);
        return(
          <div style={{marginBottom:12,padding:"10px 12px",background:"rgba(52,211,153,0.03)",border:"1px solid rgba(52,211,153,0.12)",borderRadius:10}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <label style={{...LBL,color:"#34d399",margin:0}}>Historial DPS (últimos 5 años)</label>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                {cagr!==null&&<span style={{fontSize:11,fontWeight:700,color:cagr>=0?"#34d399":"#f87171"}}>CAGR {cagr>=0?"+":""}{cagr}%</span>}
                <span style={{fontSize:9,color:"#3a4260"}}>Se calcula solo</span>
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:5}}>
              {years.map(yr=>{
                const entry=hist.find(h=>h.year===yr);
                return(
                  <div key={yr} style={{textAlign:"center"}}>
                    <label style={{...LBL,fontSize:9,marginBottom:3}}>{yr}</label>
                    <input style={{...INP,padding:"5px 4px",fontSize:12,textAlign:"center"}} type="number" step="any"
                      placeholder="0.00" value={entry?.dps??""} onChange={e=>{
                        const val=parseFloat(e.target.value)||0;
                        const newHist=[...hist.filter(h=>h.year!==yr),(val>0?{year:yr,dps:val}:null)].filter(Boolean).sort((a,b)=>a.year-b.year);
                        setForm(f=>({...f,divHistory:newHist}));
                      }}/>
                  </div>
                );
              })}
            </div>
            {olderYears.length>0&&(
              <div style={{marginTop:6}}>
                <button onClick={()=>setForm(f=>({...f,_showOldHist:!f._showOldHist}))}
                  style={{background:"none",border:"none",color:"#4a5270",fontSize:10,cursor:"pointer",padding:"2px 0",fontFamily:"'Figtree',sans-serif"}}>
                  {form._showOldHist?"▲":"▶"} Histórico de dividendos ({olderYears.length} años anteriores)
                </button>
                {form._showOldHist&&(
                  <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:5,marginTop:6}}>
                    {olderYears.map(yr=>{
                      const entry=hist.find(h=>h.year===yr);
                      return(
                        <div key={yr} style={{textAlign:"center"}}>
                          <label style={{...LBL,fontSize:9,marginBottom:3,color:"#3a4260"}}>{yr}</label>
                          <input style={{...INP,padding:"5px 4px",fontSize:12,textAlign:"center",opacity:0.7}} type="number" step="any"
                            placeholder="0.00" value={entry?.dps??""} onChange={e=>{
                              const val=parseFloat(e.target.value)||0;
                              const newHist=[...hist.filter(h=>h.year!==yr),(val>0?{year:yr,dps:val}:null)].filter(Boolean).sort((a,b)=>a.year-b.year);
                              setForm(f=>({...f,divHistory:newHist}));
                            }}/>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}
            <div style={{marginTop:8,display:"flex",alignItems:"center",gap:10}}>
              <div style={{flex:1}}>
                <label style={{...LBL,fontSize:9}}>Años consecutivos subiendo dividendo</label>
                <input style={{...INP,padding:"5px 8px",fontSize:12}} type="number" step="1" min="0"
                  placeholder="ej: 28" value={form.div_streak||""}
                  onChange={e=>setForm(f=>({...f,div_streak:e.target.value}))}/>
              </div>
              {parseInt(form.div_streak)>=10&&(
                <div style={{fontSize:22,marginTop:14}}>{streakBadge(form.div_streak)}{parseInt(form.div_streak)>=35?" Oro":parseInt(form.div_streak)>=25?" Plata":" Bronce"}</div>
              )}
            </div>
            <p style={{fontSize:9,color:"#3a4260",marginTop:5}}>Se rellena automáticamente al refrescar Yahoo Finance. Puedes editarlo manualmente.</p>
          </div>
        );
      })()}
      {/* Metrics */}
      <div style={{display:"grid",gap:7}}>
        {ms.filter(m=>!m.isDCF).map(m=>{const s=live.scores[m.id],has=form.values[m.id]!==undefined&&form.values[m.id]!=="";return(
          <div key={m.id} style={{padding:"10px 12px",background:"rgba(255,255,255,0.02)",border:"1px solid "+(has?sC(s)+"30":"rgba(255,255,255,0.04)"),borderRadius:9}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
              <div style={{flex:1,minWidth:0}}>

                  <span style={{fontSize:12,color:"#8090a8",fontWeight:500}}>{m.label}</span>

                </div>
                {openH===m.id&&<p style={{fontSize:11,color:"#4a5270",fontStyle:"italic",marginBottom:3}}>{m.hint}</p>}
                {!m.skipRanges&&<button style={{background:"none",border:"none",color:"#2a3a55",fontSize:10,cursor:"pointer",padding:0}} onClick={()=>setShowR(showR===m.id?null:m.id)}>{showR===m.id?"ocultar rangos":"ver rangos"}</button>}
                {!m.skipRanges&&showR===m.id&&<div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:3,marginTop:6}}>{m.ranges.map((r,i)=><div key={i} style={{background:sBg(10-i),borderRadius:5,padding:"3px 2px",textAlign:"center"}}><span style={{fontSize:11,fontWeight:800,color:sC(10-i)}}>{10-i}</span><span style={{fontSize:9,color:sC(10-i),opacity:0.75,display:"block"}}>{r}</span></div>)}</div>}
              </div>
              <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
                {(()=>{
                  const lp=form.liveData?.price||parseFloat(form.dcf?.price)||0;
                  const cf=parseFloat(form.dcf?.cf)||0;
                  const dps=parseFloat(form.dps)||0;
                  // div_years: ALWAYS locked — auto from div_streak
                  if(m.id==="div_years"){
                    const val=form.div_streak&&parseInt(form.div_streak)>0?parseInt(form.div_streak):null;
                    return<div style={{width:80,padding:"7px 8px",background:val?"rgba(167,139,250,0.08)":"rgba(255,255,255,0.02)",border:"1px solid "+(val?"rgba(167,139,250,0.3)":"rgba(255,255,255,0.08)"),borderRadius:8,textAlign:"center",fontSize:val?13:9,fontWeight:700,color:val?"#a78bfa":"#3a4260",cursor:"default"}} title="Tomado de Años consecutivos">{val?val+"a":"ver arriba"}</div>;
                  }
                  // yield_pct: ALWAYS locked — auto from DPS/price
                  if(m.id==="yield_pct"){
                    const val=dps>0&&lp>0?(dps/lp*100).toFixed(2):null;
                    return<div style={{width:80,padding:"7px 8px",background:val?"rgba(52,211,153,0.08)":"rgba(255,255,255,0.02)",border:"1px solid "+(val?"rgba(52,211,153,0.3)":"rgba(255,255,255,0.08)"),borderRadius:8,textAlign:"center",fontSize:val?13:10,fontWeight:700,color:val?"#34d399":"#3a4260",cursor:"default"}} title="Calculado automáticamente de DPS ÷ precio">{val?val+"%":"DPS+precio"}</div>;
                  }
                  // p_fcf / p_affo: ALWAYS locked — auto from price/cf
                  if(m.id==="p_fcf"||m.id==="p_affo"){
                    const val=cf>0&&lp>0?(lp/cf).toFixed(1):null;
                    return<div style={{width:80,padding:"7px 8px",background:val?"rgba(96,165,250,0.08)":"rgba(255,255,255,0.02)",border:"1px solid "+(val?"rgba(96,165,250,0.3)":"rgba(255,255,255,0.08)"),borderRadius:8,textAlign:"center",fontSize:val?13:10,fontWeight:700,color:val?"#60a5fa":"#3a4260",cursor:"default"}} title="Calculado automáticamente de precio ÷ FCF por acción">{val?val+"x":"precio+FCF"}</div>;
                  }
                  return<div style={{position:"relative"}}><input style={{...INP,width:80,padding:"7px 28px 7px 8px",fontSize:14}} type="number" step="any" placeholder={m.placeholder} value={form.values[m.id]??""} onChange={e=>sV(m.id,e.target.value)}/><span style={{position:"absolute",right:6,top:"50%",transform:"translateY(-50%)",fontSize:10,color:"#3a4260",pointerEvents:"none"}}>{m.unit}</span></div>;
                })()}
                <div style={{width:30,height:30,borderRadius:7,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:700,flexShrink:0,background:sBg(s),color:sC(s),opacity:has?1:0.25}}>{has?(s!=null?s:"—"):"—"}</div>
              </div>
            </div>
          </div>
        );})}
      </div>
      <DCFSection form={form} setForm={setForm} metrics={ms} live={live}/>
      {/* Withholding taxes */}
      <div style={{marginTop:10,padding:"12px",background:"rgba(251,191,36,0.04)",border:"1px solid rgba(251,191,36,0.2)",borderRadius:12}}>
        <p style={{fontSize:12,fontWeight:600,color:"#fbbf24",marginBottom:8}}>Retenciones fiscales</p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
          <div>
            <label style={LBL}>Retención origen % <span style={{textTransform:"none",color:"#3a4260"}}>(por defecto de {getCountry(form.country||"US").name})</span></label>
            <input style={INP} type="number" step="0.1" placeholder={String(getWHT(form.country||"US"))}
              value={form.originWHT!=null?form.originWHT:getWHT(form.country||"US")}
              onChange={e=>setForm(f=>({...f,originWHT:parseFloat(e.target.value)||0}))}/>
          </div>
          <div>
            <label style={LBL}>Tu retención destino %</label>
            <input style={INP} type="number" step="0.1" placeholder={String(dest)} value={dest} readOnly style={{...INP,opacity:0.6,cursor:"not-allowed"}}/>
            <p style={{fontSize:10,color:"#3a4260",marginTop:3}}>Cambia en ajustes globales</p>
          </div>
        </div>
        {yld>0&&(
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
            <div style={{padding:"8px",background:"rgba(255,255,255,0.02)",borderRadius:8,textAlign:"center"}}><p style={{fontSize:9,color:"#4a5270"}}>Yield bruto</p><p style={{fontSize:16,fontWeight:700,color:"#c8d0e0"}}>{yld}%</p></div>
            <div style={{padding:"8px",background:"rgba(255,255,255,0.02)",borderRadius:8,textAlign:"center"}}><p style={{fontSize:9,color:"#4a5270"}}>Retención efectiva</p><p style={{fontSize:16,fontWeight:700,color:"#fbbf24"}}>{Math.max(originWHT,dest)}%</p></div>
            <div style={{padding:"8px",background:"rgba(52,211,153,0.08)",borderRadius:8,textAlign:"center"}}><p style={{fontSize:9,color:"#4a5270"}}>Yield neto</p><p style={{fontSize:16,fontWeight:700,color:"#34d399"}}>{netY}%</p></div>
          </div>
        )}
      </div>

      </div>
    </div>
  );
}

function isStale(co){
  if(!co.date)return false;
  const p=co.date.split("/");if(p.length!==3)return false;
  const d=new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));
  const ago=new Date();ago.setFullYear(ago.getFullYear()-1);
  return d<ago;
}
function calcDivQuality(co,destWHT){
  let score=0,weight=0;
  // Safety: payout (weight 1.5)
  const payout=parseFloat(co.values?.payout_fcf);
  if(!isNaN(payout)&&payout>0){
    const s=payout<40?10:payout<50?9:payout<60?7:payout<70?5:payout<80?3:1;
    score+=s*1.5;weight+=1.5;
  }
  // Safety: debt/ebitda (weight 1)
  const debt=parseFloat(co.values?.debt_ebitda);
  if(!isNaN(debt)&&debt>=0){
    const s=debt<1?10:debt<2?8:debt<3?6:debt<4?4:2;
    score+=s;weight+=1;
  }
  // Growth: CAGR5 (weight 1.5)
  const cagr=parseFloat(co.values?.div_cagr5);
  if(!isNaN(cagr)&&cagr>0){
    const s=cagr>12?10:cagr>9?9:cagr>7?8:cagr>5?6:cagr>3?4:2;
    score+=s*1.5;weight+=1.5;
  }
  // Growth: streak (weight 1)
  const streak=parseInt(co.div_streak)||0;
  if(streak>0){
    const s=streak>=35?10:streak>=25?9:streak>=15?7:streak>=10?6:streak>=5?4:2;
    score+=s;weight+=1;
  }
  // Yield net (weight 1)
  const yld=parseFloat(co.values?.yield_pct);
  if(!isNaN(yld)&&yld>0){
    const orig=co.originWHT!=null?co.originWHT:getWHT(co.country||"US");
    const ny=netYield(yld,orig,destWHT||19);
    const s=ny>5?10:ny>3.5?8:ny>2.5?6:ny>1.5?4:2;
    score+=s;weight+=1;
  }
  if(weight===0)return null;
  return parseFloat((score/weight).toFixed(1));
}
function streakBadge(streak){
  const s=parseInt(streak)||0;
  if(s>=35)return"🥇";
  if(s>=25)return"🥈";
  if(s>=10)return"🥉";
  return null;
}
function is1010(co){
  const y=parseFloat(co.values?.yield_pct)||0;
  const g=parseFloat(co.values?.div_cagr5)||0;
  return y+g>=10&&y>0&&g>0;
}

function detectMoat(co){
  let score=0; const signals=[];
  const roic=parseFloat(co.roic||co.values?.roic)||0;
  const gm=parseFloat(co.gross_margin)||0;
  const om=parseFloat(co.operating_margin)||0;
  const fcagr=parseFloat(co.values?.fcf_cagr5||co.fcf_cagr5)||0;
  const rcagr=parseFloat(co.revenue_cagr5)||0;

  // ROIC signal (0-35)
  if(roic>25){score+=35;signals.push("ROIC excepcional ("+roic.toFixed(1)+"%)");}
  else if(roic>20){score+=28;signals.push("ROIC muy elevado ("+roic.toFixed(1)+"%)");}
  else if(roic>15){score+=20;signals.push("ROIC sólido ("+roic.toFixed(1)+"%)");}
  else if(roic>10){score+=10;}

  // Gross margin — pricing power (0-25)
  if(gm>60){score+=25;signals.push("Alto poder de fijación de precios ("+gm.toFixed(0)+"% margen bruto)");}
  else if(gm>45){score+=18;signals.push("Márgenes brutos sólidos ("+gm.toFixed(0)+"%)");}
  else if(gm>30){score+=10;}
  else if(gm>20){score+=5;}

  // Margin stability from historical (0-20)
  const omh=co.op_margin_history||{};
  const omYears=Object.keys(omh).sort();
  if(omYears.length>=4){
    const recent=omYears.slice(-2).map(y=>omh[y]);
    const older=omYears.slice(-4,-2).map(y=>omh[y]);
    const ra=recent.reduce((a,b)=>a+b,0)/recent.length;
    const oa=older.reduce((a,b)=>a+b,0)/older.length;
    if(ra>=oa*0.97&&ra>15){score+=20;signals.push("Márgenes operativos estables o en mejora");}
    else if(ra>=oa*0.90){score+=10;}
  }

  // FCF consistency (0-20)
  if(fcagr>10){score+=20;signals.push("FCF creciendo con fuerza (CAGR "+fcagr.toFixed(1)+"%)");}
  else if(fcagr>5){score+=12;}
  else if(fcagr>0){score+=6;}

  if(score<20)return null;
  const width=score>=60?"wide":score>=35?"narrow":"none";
  if(width==="none")return null;

  // Identify moat source
  const sources=[];
  if(gm>50&&roic>15)sources.push("Activos intangibles / marca");
  else if(gm>50)sources.push("Poder de fijación de precios");
  if(roic>20&&gm<40)sources.push("Ventaja de costes o escala");
  if(rcagr>8&&roic>15)sources.push("Posible efecto red o costes de cambio");
  if(om>25)sources.push("Eficiencia operativa superior");

  return{width,score,signals,sources};
}

function detectErosion(co){
  const eroding=[];let totalPenalty=0;
  const check=(hist,label,threshold=3)=>{
    const yrs=Object.keys(hist||{}).sort();
    if(yrs.length<4)return;
    const recent=yrs.slice(-2).map(y=>hist[y]);
    const older=yrs.slice(-4,-2).map(y=>hist[y]);
    const ra=recent.reduce((a,b)=>a+b,0)/recent.length;
    const oa=older.reduce((a,b)=>a+b,0)/older.length;
    const decline=oa-ra;
    if(decline>threshold){
      const pen=decline>10?1.0:decline>6?0.6:0.3;
      totalPenalty=Math.max(totalPenalty,pen);
      eroding.push({metric:label,decline:parseFloat(decline.toFixed(1)),penalty:pen});
    }
  };
  check(co.op_margin_history,"Margen operativo");
  check(co.net_margin_history,"Margen neto");
  // Check ROIC trend via equity history
  const eh=co.equity_history_m||{},nh=co.net_income_history_m||{};
  const eyrs=Object.keys(eh).filter(y=>eh[y]&&nh[y]).sort();
  if(eyrs.length>=4){
    const roicHist={};
    eyrs.forEach(y=>{if(eh[y]>0)roicHist[y]=(nh[y]/eh[y])*100;});
    check(roicHist,"ROIC estimado",4);
  }
  if(!eroding.length)return null;
  return{eroding,totalPenalty:parseFloat(totalPenalty.toFixed(2))};
}

function generateInsights(co){
  const v=co.values||{}, d=co.dcf||{};
  const tips=[];
  const add=(type,text)=>tips.push({type,text});

  // ── Balance / Deuda ──────────────────────────────────────
  const nd=parseFloat(co.net_debt);
  if(!isNaN(nd)&&nd<0) add("green","Tiene más efectivo que deuda en balance");
  const nde=parseFloat(co.net_debt_ebitda||v.debt_ebitda);
  if(!isNaN(nde)){
    if(nde<1)       add("green","Deuda neta muy controlada ("+nde.toFixed(1)+"x EBITDA)");
    else if(nde<2)  add("yellow","Deuda moderada ("+nde.toFixed(1)+"x EBITDA)");
    else if(nde>3.5)add("red","Deuda elevada ("+nde.toFixed(1)+"x EBITDA)");
  }
  const ic=parseFloat(co.interest_coverage||v.interest_cov);
  if(!isNaN(ic)&&ic>0){
    if(ic>15)      add("green","Cobertura de intereses excelente ("+ic.toFixed(1)+"x)");
    else if(ic>5)  add("green","Buena cobertura de intereses ("+ic.toFixed(1)+"x)");
    else if(ic<3)  add("red","Cobertura de intereses baja ("+ic.toFixed(1)+"x)");
  }
  const cr=parseFloat(co.current_ratio);
  if(!isNaN(cr)){
    if(cr>2)      add("green","Liquidez holgada (ratio corriente "+cr.toFixed(1)+")");
    else if(cr<1) add("red","Liquidez ajustada (ratio corriente "+cr.toFixed(1)+")");
  }

  // ── Dividendo ────────────────────────────────────────────
  const streak=parseInt(co.div_streak||v.div_years)||0;
  if(streak>=35)     add("green","Más de 35 años consecutivos subiendo el dividendo 🥇");
  else if(streak>=25)add("green","Aristócrata del dividendo: "+streak+" años consecutivos 🥈");
  else if(streak>=10)add("green",streak+" años consecutivos de crecimiento del dividendo 🥉");
  else if(streak>0)  add("yellow",streak+" años subiendo el dividendo — historial en construcción");

  const cagr=parseFloat(co.div_cagr5||v.div_cagr5);
  if(!isNaN(cagr)&&cagr>0){
    if(cagr>=12)     add("green","Dividendo creciendo a doble dígito (CAGR "+cagr+"%)");
    else if(cagr>=7) add("green","Buen crecimiento del dividendo (CAGR "+cagr+"%)");
    else if(cagr<2)  add("yellow","Crecimiento del dividendo lento (CAGR "+cagr+"%)");
  }

  const pfcf=parseFloat(co.payout_fcf||v.payout_fcf);
  const peps=parseFloat(co.payout_eps);
  if(!isNaN(pfcf)&&pfcf>0){
    if(pfcf<40)       add("green","Payout sobre FCF muy sostenible ("+pfcf.toFixed(0)+"%)");
    else if(pfcf<65)  add("green","Payout sobre FCF razonable ("+pfcf.toFixed(0)+"%)");
    else if(pfcf>90)  add("red","Payout sobre FCF elevado — dividendo en riesgo ("+pfcf.toFixed(0)+"%)");
    else if(pfcf>75)  add("yellow","Payout sobre FCF alto ("+pfcf.toFixed(0)+"%)");
  }
  if(!isNaN(peps)&&peps>100) add("red","El dividendo supera el beneficio por acción (payout EPS "+peps.toFixed(0)+"%)");

  // ── Rentabilidad ─────────────────────────────────────────
  const roic=parseFloat(co.roic||v.roic);
  if(!isNaN(roic)&&roic>0){
    if(roic>20)      add("green","ROIC excelente ("+roic.toFixed(1)+"%) — negocio muy rentable");
    else if(roic>12) add("green","Buen ROIC ("+roic.toFixed(1)+"%)");
    else if(roic<6)  add("yellow","ROIC por debajo de la media ("+roic.toFixed(1)+"%)");
  }
  const gm=parseFloat(co.gross_margin);
  if(!isNaN(gm)){
    if(gm>60)       add("green","Márgenes brutos elevados ("+gm.toFixed(0)+"%) — ventaja competitiva");
    else if(gm<20)  add("yellow","Márgenes brutos ajustados ("+gm.toFixed(0)+"%)");
  }
  const om=parseFloat(co.operating_margin||v.margin_safety);
  const opMargin=parseFloat(co.operating_margin);
  if(!isNaN(opMargin)){
    if(opMargin>25) add("green","Margen operativo sólido ("+opMargin.toFixed(0)+"%)");
    else if(opMargin<8) add("yellow","Margen operativo estrecho ("+opMargin.toFixed(0)+"%)");
  }
  const nm=parseFloat(co.net_margin);
  if(!isNaN(nm)&&nm<5&&nm>0) add("yellow","Margen neto ajustado ("+nm.toFixed(1)+"%)");

  // ── Crecimiento ──────────────────────────────────────────
  const rcagr=parseFloat(co.revenue_cagr5);
  if(!isNaN(rcagr)){
    if(rcagr>10)    add("green","Ingresos creciendo con fuerza (CAGR "+rcagr.toFixed(1)+"%)");
    else if(rcagr>5)add("green","Crecimiento de ingresos estable (CAGR "+rcagr.toFixed(1)+"%)");
    else if(rcagr<0)add("red","Ingresos en declive (CAGR "+rcagr.toFixed(1)+"%)");
  }
  const fcagr=parseFloat(co.fcf_cagr5||v.fcf_cagr5);
  if(!isNaN(fcagr)&&fcagr>10) add("green","FCF creciendo con fuerza (CAGR "+fcagr.toFixed(1)+"%)");

  // ── Valoración ───────────────────────────────────────────
  const mos=parseFloat(d.mos);
  if(!isNaN(mos)){
    if(mos>30)      add("green","Gran margen de seguridad vs valor intrínseco (+"+mos.toFixed(0)+"%)");
    else if(mos>10) add("green","Cotiza por debajo de valor intrínseco (+"+mos.toFixed(0)+"%)");
    else if(mos<-20)add("red","Cotiza significativamente por encima del valor intrínseco ("+mos.toFixed(0)+"%)");
  }
  const pe=parseFloat(co.pe_trailing);
  if(!isNaN(pe)&&pe>0){
    if(pe<13)       add("green","PER atractivo ("+pe.toFixed(1)+"x)");
    else if(pe>35)  add("yellow","PER elevado ("+pe.toFixed(1)+"x)");
  }
  const eveb=parseFloat(co.ev_ebitda);
  if(!isNaN(eveb)&&eveb>0){
    if(eveb<8)      add("green","EV/EBITDA razonable ("+eveb.toFixed(1)+"x)");
    else if(eveb>20)add("yellow","EV/EBITDA elevado ("+eveb.toFixed(1)+"x)");
  }

  // ── Precio vs 52 semanas ─────────────────────────────────
  const price=co.liveData?.price||parseFloat(co.current_price)||0;
  const high52=parseFloat(co.week52_high);
  const low52=parseFloat(co.week52_low);
  if(price>0&&!isNaN(high52)&&high52>0){
    const distHigh=(high52-price)/high52*100;
    if(distHigh>20) add("green","Cotiza un "+distHigh.toFixed(0)+"% por debajo de máximos anuales");
    else if(distHigh<5) add("yellow","Cerca de máximos anuales ("+distHigh.toFixed(0)+"% por debajo)");
  }
  if(price>0&&!isNaN(low52)&&low52>0){
    const distLow=(price-low52)/low52*100;
    if(distLow<10) add("yellow","Cotiza cerca de mínimos anuales (+"+distLow.toFixed(0)+"%)");
  }

  // ── Beta ─────────────────────────────────────────────────
  const beta=parseFloat(co.beta);
  if(!isNaN(beta)){
    if(beta<0.6)     add("green","Baja volatilidad — beta "+beta.toFixed(2)+" (muy defensiva)");
    else if(beta<0.9)add("green","Volatilidad moderada — beta "+beta.toFixed(2));
    else if(beta>1.4)add("yellow","Alta volatilidad — beta "+beta.toFixed(2));
  }

  return tips;
}

function mosColor(mos){
  if(mos==null)return"#3a4260";
  if(mos>25)return"#34d399";
  if(mos>=1)return"#fbbf24";
  return"#f87171";
}

function CompareSelector({companies,compareList,toggleCompare}){
  const[q,setQ]=React.useState("");
  const results=React.useMemo(()=>{
    const base=[...companies].sort((a,b)=>b.total-a.total);
    if(!q)return base;
    const ql=q.toLowerCase();
    return base.filter(co=>co.name.toLowerCase().includes(ql)||(co.ticker||"").toLowerCase().includes(ql));
  },[companies,q]);
  return(
    <React.Fragment>
      <input style={{...INP,marginBottom:8,fontSize:13}} placeholder="🔍 Buscar en tu índice..."
        value={q} onChange={e=>setQ(e.target.value)} autoComplete="off"/>
      <div style={{display:"grid",gap:4}}>
        {results.map(co=>{
          const sel=compareList.includes(co.id),si=compareList.indexOf(co.id),col=sel?CC[si]:"#3a4260";
          const sc2=SECTORS[co.sector]||SECTORS.general;
          return(
            <button key={co.id} onClick={()=>toggleCompare(co.id)}
              style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",background:sel?"rgba(255,255,255,0.04)":"rgba(255,255,255,0.02)",border:"1px solid "+(sel?col+"60":"rgba(255,255,255,0.04)"),borderRadius:9,cursor:"pointer",textAlign:"left",width:"100%",fontFamily:"'Figtree',sans-serif"}}>
              <div style={{width:20,height:20,borderRadius:"50%",border:"2px solid "+(sel?col:"rgba(255,255,255,0.15)"),background:sel?col:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,color:"#000",fontSize:10,fontWeight:800}}>{sel?si+1:""}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                  <span style={{fontSize:13,fontWeight:700,color:sel?col:"#c8d0e0"}}>{co.name}</span>
                  {co.ticker&&<span style={{fontSize:10,color:"#3a4260"}}>{co.ticker}</span>}
                  <span style={{fontSize:9,color:sc2.color,background:sc2.color+"15",padding:"1px 5px",borderRadius:3}}>{sc2.label}</span>
                </div>
              </div>
              <span style={{fontSize:16,fontWeight:800,color:sC(co.total),flexShrink:0}}>{co.total.toFixed(1)}</span>
            </button>
          );
        })}
        {companies.length===0&&<p style={{fontSize:12,color:"#3a4260",textAlign:"center",padding:"20px 0"}}>Tu índice está vacío.</p>}
      </div>
    </React.Fragment>
  );
}

                <div style={{display:"flex",alignItems:"flex-end",height:90,gap:3}}>
                  {hist.map((h,i)=>{
                    const prev=i>0?hist[i-1].dps:null;
                    const grew=prev!=null&&h.dps>prev,shrk=prev!=null&&h.dps<prev;
                    const col=grew?"#34d399":shrk?"#f87171":"rgba(255,255,255,0.2)";
                    const barH=Math.max(Math.round(h.dps/maxDPS*88),4);
                    return <div key={h.year} style={{flex:1,minWidth:28,height:barH+"px",background:col,borderRadius:"3px 3px 0 0"}}/>;
                  })}
                </div>
                {/* Fila 3: años — posición fija */}
                <div style={{display:"flex",gap:3,marginTop:3}}>
                  {hist.map((h,i)=><div key={h.year} style={{flex:1,minWidth:28,textAlign:"center",fontSize:8,color:"#4a5270"}}>{String(h.year).slice(2)}</div>)}
                </div>

            </div>

        )}

        {/* Thesis */}
        {co.thesis&&(

            <p style={{fontSize:12,color:"#8090a8",lineHeight:1.5}}>{co.thesis}</p>

        {/* Actions */}
        <div style={{display:"flex",gap:10}}>
          <button onClick={onEdit} style={{...BTN,flex:1,background:"rgba(99,102,241,0.2)",color:"#818cf8"}}>✏️ Editar</button>
          <button onClick={onDelete} style={{...BTN,background:"rgba(248,113,113,0.1)",color:"#f87171"}}>🗑 Eliminar</button>
        </div>
      </div>
    </div>
  );
}

const EMPTY={name:"",ticker:"",sector:"general",country:"US",values:{},dcf:{cf:"",discount:"10",terminal:"2.5",price:"",growth2:""},thesis:"",history:[],originWHT:null,dps:"",div_streak:""};

function App(){

  const fileRef=React.useRef();

  React.useEffect(()=>{try{const s=localStorage.getItem("dgi-v5");if(s)setCompanies(JSON.parse(s));}catch(e){};},[]);

  async function handleFetchFundamentals(){
    if(!githubUrl){setShowGithubSettings(true);return;}
    setFetchingFund(true);setFundMsg("Cargando fundamentales...");
    try{
      const r=await fetch(githubUrl+"?t="+Date.now(),{signal:AbortSignal.timeout(15000)});
      if(!r.ok)throw new Error("HTTP "+r.status);
      const data=await r.json();
      const list=Array.isArray(data)?data:data.fundamentals||data.companies||[];
      if(!list.length)throw new Error("JSON vacío o formato incorrecto");
      let updated=0;
      setCompanies(prev=>{
        const nl=prev.map(co=>{
          const fd=list.find(f=>f.ticker&&co.ticker&&f.ticker.toUpperCase()===co.ticker.toUpperCase());
          if(!fd)return co;
          updated++;
          const newVals={...co.values};
          if(fd.payout_fcf!=null)newVals.payout_fcf=fd.payout_fcf;
          if(fd.debt_ebitda!=null)newVals.debt_ebitda=fd.debt_ebitda;
          if(fd.fcf_cagr5!=null)newVals.fcf_cagr5=fd.fcf_cagr5;
          if(fd.div_cagr5!=null)newVals.div_cagr5=fd.div_cagr5;
          if(fd.roic!=null)newVals.roic=fd.roic;
          if(fd.interest_cov!=null)newVals.interest_cov=fd.interest_cov;
          if(fd.yield_pct!=null)newVals.yield_pct=fd.yield_pct;
          const newDcf={...(co.dcf||{})};
          if(fd.fcf_per_share!=null)newDcf.cf=String(fd.fcf_per_share);
          const patch={values:newVals,dcf:newDcf};
          if(fd.dps!=null)patch.dps=String(fd.dps);
          if(fd.div_streak!=null)patch.div_streak=String(fd.div_streak);
      // Save extra scalar fields directly on company
      const extraFields=["gross_margin","operating_margin","net_margin","roa","beta",
        "pe_trailing","pe_forward","ev_ebitda","price_to_book","price_to_sales",
        "interest_coverage","current_ratio","net_debt","net_debt_ebitda","debt_to_equity",
        "revenue_cagr5","net_income_cagr5","market_cap_m","shares_outstanding_m",
        "five_yr_avg_yield","week52_high","week52_low","insider_ownership_pct",
        "inst_ownership_pct","earnings_growth_yoy","revenue_growth_yoy","payout_eps",
        "eps_trailing","eps_forward","current_price","fcf_per_share",
        // Historical series
        "op_margin_history","net_margin_history","revenue_history_m",
        "net_income_history_m","ebit_history_m","fcf_history_m",
        "total_debt_history_m","equity_history_m","net_debt_history_m"];
      extraFields.forEach(k=>{if(fd[k]!=null)patch[k]=fd[k];});
          if(fd.divHistory&&fd.divHistory.length)patch.divHistory=fd.divHistory;
          // Recalc div_years from streak
          if(fd.div_streak!=null)newVals.div_years=parseInt(fd.div_streak);
          const{scores,total,count}=cS(newVals,co.sector);
          return{...co,...patch,scores,total:parseFloat(total.toFixed(2)),count};
        });
        nl.sort((a,b)=>b.total-a.total);persist(nl);return nl;
      });
      setFundMsg("✓ "+updated+" empresas actualizadas con fundamentales.");
    }catch(e){
      setFundMsg("✗ Error: "+e.message);
    }
    setFetchingFund(false);
    setTimeout(()=>setFundMsg(""),8000);
  }
  function persist(l){try{localStorage.setItem("dgi-v5",JSON.stringify(l));}catch(e){}}
  function saveDestWHT(v){const n=parseFloat(v)||19;setDestWHT(n);localStorage.setItem("dgi-dest-wht",String(n));}
  function toggleCompare(id){setCompareList(l=>l.includes(id)?l.filter(x=>x!==id):l.length<5?[...l,id]:l);}

  const filtered=React.useMemo(()=>companies.filter(co=>{
    if(search&&!co.name.toLowerCase().includes(search.toLowerCase())&&!(co.ticker||"").toLowerCase().includes(search.toLowerCase()))return false;
    if(minScore>0&&co.total<minScore)return false;
    if(filterSector&&co.sector!==filterSector)return false;
    return true;
  }),[companies,search,filterSector,minScore]);
  const sorted=React.useMemo(()=>{
    const arr=[...filtered];
    if(sortBy==="score") return arr.sort((a,b)=>b.total-a.total);
    if(sortBy==="rentable"){
      const get10y=co=>{
        const yld=parseFloat(co.values?.yield_pct)||0;
        if(!yld)return-1;
        const g=Math.min((parseFloat(co.values?.div_cagr5)||0)*0.85,9);
        const orig=co.originWHT!=null?co.originWHT:getWHT(co.country||"US");
        const rows=project10y(1000,yld,g,orig,destWHT||19);
        return rows?rows[9].cum:-1;
      };
      return arr.sort((a,b)=>get10y(b)-get10y(a));
    }
    if(sortBy==="barata"){
      return arr.sort((a,b)=>{
        const ma=a.dcf?.mos??-999,mb=b.dcf?.mos??-999;
        return mb-ma;
      });
    }
    if(sortBy==="divquality"){
      return arr.sort((a,b)=>{
        const qa=calcDivQuality(a,destWHT)??-1,qb=calcDivQuality(b,destWHT)??-1;
        return qb-qa;
      });
    }
    return arr;
  },[filtered,sortBy,destWHT]);
  const bySector=React.useMemo(()=>{const g={};filtered.forEach(co=>{const s=co.sector||"general";if(!g[s])g[s]=[];g[s].push(co);});return g;},[filtered]);
  const byCountry=React.useMemo(()=>{const g={};filtered.forEach(co=>{const ct=co.country||"OTHER";if(!g[ct])g[ct]=[];g[ct].push(co);});return g;},[filtered]);
  const compareCompanies=React.useMemo(()=>compareList.map(id=>companies.find(co=>co.id===id)).filter(Boolean),[compareList,companies]);
  const avgScore=sorted.length?sorted.reduce((a,b)=>a+b.total,0)/sorted.length:0;
  const availableSectors=[...new Set(companies.map(co=>co.sector))];
  const TABS=[{id:"index",label:"Índice"},{id:"sectores",label:"Sectores"},{id:"paises",label:"Países"},{id:"comparar",label:compareList.length>0?"Comparar ("+compareList.length+")":"Comparar"}];

  function handleSave(form){
    // Auto-compute yield_pct from DPS + live price if available
    const savedValues={...form.values};
    // Auto-fill div_years from div_streak
    if(form.div_streak&&parseInt(form.div_streak)>0)
      savedValues.div_years=parseInt(form.div_streak);
    const _lp=form.liveData?.price||parseFloat(form.dcf?.price)||0;
    const _cf=parseFloat(form.dcf?.cf)||0;
    if(form.dps&&parseFloat(form.dps)>0&&_lp>0)
      savedValues.yield_pct=parseFloat((parseFloat(form.dps)/_lp*100).toFixed(2));
    if(_cf>0&&_lp>0){
      if(savedValues.p_fcf===undefined||savedValues.p_fcf==="")
        savedValues.p_fcf=parseFloat((_lp/_cf).toFixed(2));
      if(savedValues.p_affo===undefined||savedValues.p_affo==="")
        savedValues.p_affo=parseFloat((_lp/_cf).toFixed(2));
    }
    // Duplicate check (only for new entries)
    if(!editingId){
      const t=(form.ticker||"").trim().toUpperCase();
      const n=form.name.trim().toLowerCase();
      const dup=companies.find(co=>(t&&co.ticker&&co.ticker.toUpperCase()===t)||co.name.trim().toLowerCase()===n);
      if(dup){alert(dup.name+" ya está en tu índice.");return;}
    }
    const{scores,total,count}=cS(savedValues,form.sector);
    const co={id:editingId||Date.now().toString(),name:form.name.trim(),ticker:(form.ticker||"").trim().toUpperCase(),sector:form.sector||"general",country:form.country||"US",values:savedValues,scores,total:parseFloat(total.toFixed(2)),count,date:new Date().toLocaleDateString("es-ES"),dcf:form.dcf||null,thesis:form.thesis||"",originWHT:form.originWHT!=null?form.originWHT:getWHT(form.country||"US"),_superSector:form._superSector||"",divHistory:form.divHistory||null,_sectorName:form._sectorName||"",_currency:form._currency||"",dps:form.dps||"",div_streak:form.div_streak||""};
    const nl=editingId?companies.map(x=>x.id===editingId?co:x):[...companies,co];
    nl.sort((a,b)=>b.total-a.total);setCompanies(nl);persist(nl);
    setEditData(null);setEditingId(null);setView("list");setSelected(co);
  }
  function handleEdit(co){setEditData({...co,values:{...co.values},dps:co.dps||"",div_streak:co.div_streak||"",divHistory:co.divHistory||null});setEditingId(co.id);setView("form");}
  function handleDelete(id){if(!confirm("¿Eliminar esta empresa?"))return;const nl=companies.filter(c=>c.id!==id);setCompanies(nl);persist(nl);if(selected?.id===id)setSelected(null);}
  function handleExport(){const blob=new Blob([JSON.stringify({version:5,exportDate:new Date().toISOString(),companies},null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="mi-indice-dgi.json";a.click();URL.revokeObjectURL(url);}
  function handleImport(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const data=JSON.parse(ev.target.result);const list=data.companies||data;if(!Array.isArray(list))throw new Error("Formato incorrecto");if(confirm("Importar "+list.length+" empresas?")){list.sort((a,b)=>b.total-a.total);setCompanies(list);persist(list);setSelected(null);}}catch(err){alert("Error: "+err.message);}};reader.readAsText(file);e.target.value="";}
  async function handleRefresh(){
    const wt=companies.filter(c=>c.ticker);if(!wt.length){setRefreshMsg("Sin tickers.");return;}
    setRefreshing(true);setRefreshMsg("Actualizando "+wt.length+"...");let ok=0,fail=0;const updated=[...companies];
    await Promise.all(wt.map(async co=>{try{const ld=await fetchYahoo(co.ticker);const idx=updated.findIndex(x=>x.id===co.id);if(idx<0)return;
      const nd={...(updated[idx].dcf||{}),price:ld.price?String(ld.price.toFixed(2)):""};const nv={...updated[idx].values};
      // Recompute yield from DPS and p_fcf from DCF cf if available
      // Recompute yield from DPS if available
      const activeDPS=parseFloat(updated[idx].dps)||0;
      if(activeDPS>0&&ld.price>0)
        nv.yield_pct=parseFloat((activeDPS/ld.price*100).toFixed(2));
      const _rcf=parseFloat(updated[idx].dcf?.cf)||0;
      if(_rcf>0&&ld.price>0){
        nv.p_fcf=parseFloat((ld.price/_rcf).toFixed(2));
        nv.p_affo=parseFloat((ld.price/_rcf).toFixed(2));
      }
      if(nd.cf&&ld.price){const g=autoG(nv,updated[idx].sector),cf=parseFloat(nd.cf),disc=parseFloat(nd.discount||10),term=parseFloat(nd.terminal||2.5),g2=parseFloat(nd.growth2||Math.max((g||0)/2,2).toFixed(1));if(g!=null&&cf){const iv=calcDCF(cf,g,g2,disc,term);if(iv){const mos=parseFloat(((iv-ld.price)/iv*100).toFixed(1));nd.iv=iv;nd.mos=mos;nv.margin_safety=String(mos);}}}
      const{scores,total:tot,count}=cS(nv,updated[idx].sector);updated[idx]={...updated[idx],dcf:nd,values:nv,scores,total:parseFloat(tot.toFixed(2)),count};ok++;}catch(err){fail++;}}));
    // Detect opportunity alerts (MoS improved ≥10 points)
    const alerts=[];
    updated.forEach(co=>{
      const prev=companies.find(x=>x.id===co.id);
      if(!prev)return;

      if(oldMos==null||newMos==null)return;

    if(alerts.length)setRefreshAlerts(alerts);
    updated.sort((a,b)=>b.total-a.total);setCompanies(updated);persist(updated);setRefreshing(false);
    setRefreshMsg("✓ "+ok+" actualizadas"+(fail>0?" · "+fail+" fallidas":"")+".");setTimeout(()=>setRefreshMsg(""),6000);
  }

  return(
    <div style={{minHeight:"100vh",padding:"20px 14px 80px",backgroundImage:"radial-gradient(ellipse at 70% 0%,rgba(60,30,140,0.14) 0%,transparent 50%)"}}>

      <div style={{maxWidth:640,margin:"0 auto 16px",display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
        <div>
          <p style={{fontSize:10,letterSpacing:"0.22em",color:"#818cf8",textTransform:"uppercase",marginBottom:3,fontWeight:500}}>DGI · Scoring System</p>
          <h1 style={{fontSize:28,fontWeight:900,color:"#fff",letterSpacing:"-0.02em",lineHeight:1}}>Mi Índice</h1>
          {companies.length>0&&<p style={{fontSize:11,color:"#4a5270",marginTop:4}}>{companies.length} empresas · Ø{avgScore.toFixed(1)}</p>}
          <button onClick={()=>setShowMetodologia(true)} style={{...BTN,fontSize:10,padding:"3px 8px",background:"rgba(255,255,255,0.04)",color:"#4a5270",marginTop:4}}>ℹ️ Metodología</button>
        </div>
        <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
          {/* Settings buttons */}
          <div style={{display:"flex",gap:5}}>
            <button onClick={()=>{setShowGithubSettings(s=>!s);setShowWHTSettings(false);}} style={{...BTN,fontSize:11,padding:"5px 10px",background:githubUrl?"rgba(52,211,153,0.15)":"rgba(255,255,255,0.05)",color:githubUrl?"#34d399":"#6a7090"}}>⚙ GitHub{githubUrl?" ✓":""}</button>
            <button onClick={()=>{setShowWHTSettings(s=>!s);setShowGithubSettings(false);}} style={{...BTN,fontSize:11,padding:"5px 10px",background:"rgba(251,191,36,0.12)",color:"#fbbf24"}}>⚙ Ret. {destWHT}%</button>
          </div>
          {showWHTSettings&&(
            <div style={{background:"#0f1221",border:"1px solid rgba(251,191,36,0.3)",borderRadius:10,padding:"10px 12px",width:220}}>
              <p style={{fontSize:11,color:"#fbbf24",marginBottom:6}}>Tu retención en destino (IRPF)</p>
              <p style={{fontSize:10,color:"#4a5270",marginBottom:6}}>España: 19% ≤6k€ · 21% ≤50k€ · 23% más</p>
              <div style={{display:"flex",gap:4}}>
                {[19,21,23].map(v=><button key={v} onClick={()=>{saveDestWHT(v);setShowWHTSettings(false);}} style={{...BTN,flex:1,fontSize:12,padding:"6px 0",background:destWHT===v?"rgba(251,191,36,0.3)":"rgba(255,255,255,0.05)",color:destWHT===v?"#fbbf24":"#6a7090"}}>{v}%</button>)}
              </div>
              <input style={{...INP,marginTop:6,fontSize:12,padding:"6px 10px"}} type="number" step="0.1" placeholder="Otro %" defaultValue={destWHT} onBlur={e=>{saveDestWHT(e.target.value);setShowWHTSettings(false);}} onKeyDown={e=>e.key==="Enter"&&(saveDestWHT(e.target.value),setShowWHTSettings(false))}/>
            </div>

          <div style={{display:"flex",gap:5,flexWrap:"wrap",justifyContent:"flex-end"}}>
            <button onClick={handleRefresh} disabled={refreshing} style={{...BTN,fontSize:11,padding:"6px 10px",background:"rgba(99,102,241,0.15)",color:"#818cf8",opacity:refreshing?0.5:1}}>{refreshing?"⏳":"↺"} Yahoo</button>
            {githubUrl&&<button onClick={handleFetchFundamentals} disabled={fetchingFund} style={{...BTN,fontSize:11,padding:"6px 10px",background:"rgba(52,211,153,0.12)",color:"#34d399",opacity:fetchingFund?0.5:1}}>{fetchingFund?"⏳":"↺"} Fund.</button>}
            <button onClick={handleExport} disabled={companies.length===0} style={{...BTN,fontSize:11,padding:"6px 10px",background:"rgba(255,255,255,0.05)",color:"#6a7090",opacity:companies.length===0?0.3:1}}>Exportar</button>
            <button onClick={()=>fileRef.current.click()} style={{...BTN,fontSize:11,padding:"6px 10px",background:"rgba(255,255,255,0.05)",color:"#6a7090"}}>Importar</button>
            <input ref={fileRef} type="file" accept=".json" onChange={handleImport} style={{display:"none"}}/>
            <button onClick={()=>{setEditData(EMPTY);setEditingId(null);setView(view==="form"?"list":"form");}} style={{...BTN,fontSize:12,padding:"7px 12px",background:view==="form"?"rgba(255,255,255,0.06)":"rgba(99,102,241,0.8)"}}>{view==="form"?"Cancelar":"+ Añadir"}</button>
          </div>
        </div>
      </div>

      {showGithubSettings&&(
        <div style={{maxWidth:640,margin:"0 auto 10px",padding:"12px 14px",background:"#0f1221",border:"1px solid rgba(52,211,153,0.3)",borderRadius:12}}>
          <p style={{fontSize:12,fontWeight:600,color:"#34d399",marginBottom:6}}>📡 Fundamentales desde GitHub</p>
          <p style={{fontSize:10,color:"#4a5270",marginBottom:8}}>URL raw de tu fichero JSON público en GitHub:<br/>
          <span style={{color:"#3a4260"}}>https://raw.githubusercontent.com/usuario/repo/main/fundamentals.json</span></p>
          <div style={{display:"flex",gap:6,marginBottom:8}}>
            <input style={{...INP,flex:1,fontSize:12,padding:"7px 10px"}} placeholder="https://raw.githubusercontent.com/..."
              value={githubUrl} onChange={e=>setGithubUrl(e.target.value)}
              onBlur={e=>{localStorage.setItem("dgi-github-url",e.target.value);}}/>
            <button onClick={()=>{localStorage.setItem("dgi-github-url",githubUrl);setShowGithubSettings(false);handleFetchFundamentals();}}
              disabled={!githubUrl||fetchingFund}
              style={{...BTN,fontSize:12,padding:"7px 14px",background:"rgba(52,211,153,0.3)",color:"#34d399",opacity:!githubUrl||fetchingFund?0.4:1}}>
              {fetchingFund?"...":"Cargar"}
            </button>
          </div>
          <details style={{fontSize:10,color:"#4a5270"}}>
            <summary style={{cursor:"pointer",color:"#3a4260",marginBottom:4}}>Formato esperado del JSON</summary>
            <pre style={{background:"rgba(255,255,255,0.03)",borderRadius:6,padding:"8px",fontSize:9,color:"#5a6480",overflowX:"auto",lineHeight:1.5}}>{`[
  {
    "ticker": "LOW",
    "dps": 4.40,
    "div_streak": 61,
    "div_cagr5": 17.6,
    "divHistory": [
      {"year": 2020, "dps": 2.20},
      {"year": 2021, "dps": 3.00},
      {"year": 2022, "dps": 4.00},
      {"year": 2023, "dps": 4.20},
      {"year": 2024, "dps": 4.40}
    ],
    "fcf_per_share": 14.2,
    "payout_fcf": 31,
    "debt_ebitda": 1.8,
    "roic": 58,
    "fcf_cagr5": 12.1
  }
]`}</pre>
          </details>
        </div>
      )}
      {fundMsg&&<div style={{maxWidth:640,margin:"0 auto 10px",padding:"8px 14px",background:"rgba(52,211,153,0.07)",border:"1px solid rgba(52,211,153,0.25)",borderRadius:10,fontSize:12,color:"#34d399"}}>{fundMsg}</div>}
      {showMetodologia&&<Metodologia onClose={()=>setShowMetodologia(false)}/>}
      {detailCo&&(
        <CompanyDetail co={detailCo} destWHT={destWHT}
          onBack={()=>setDetailCo(null)}
          onEdit={()=>{handleEdit(detailCo);setDetailCo(null);}}
          onDelete={()=>{handleDelete(detailCo.id);setDetailCo(null);}}/>
      )}
      {!detailCo&&<React.Fragment>
      {refreshMsg&&<div style={{maxWidth:640,margin:"0 auto 10px",padding:"8px 14px",background:"rgba(99,102,241,0.08)",border:"1px solid rgba(99,102,241,0.2)",borderRadius:10,fontSize:12,color:"#818cf8"}}>{refreshMsg}</div>}
      {refreshAlerts.length>0&&(
        <div style={{maxWidth:640,margin:"0 auto 12px",padding:"10px 14px",background:"rgba(52,211,153,0.07)",border:"1px solid rgba(52,211,153,0.3)",borderRadius:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <p style={{fontSize:12,fontWeight:700,color:"#34d399"}}>⚡ {refreshAlerts.length} oportunidad{refreshAlerts.length>1?"es":""} detectada{refreshAlerts.length>1?"s":""}</p>
            <button onClick={()=>setRefreshAlerts([])} style={{background:"none",border:"none",color:"#4a5270",fontSize:14,cursor:"pointer",padding:"0 4px"}}>×</button>
          </div>
          <div style={{display:"grid",gap:5}}>
            {refreshAlerts.map(a=>(
              <div key={a.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 10px",background:"rgba(52,211,153,0.06)",borderRadius:8}}>
                <div>
                  <span style={{fontSize:12,fontWeight:600,color:"#c8d0e0"}}>{a.name}</span>
                  {a.ticker&&<span style={{fontSize:10,color:"#4a5270",marginLeft:6}}>{a.ticker}</span>}
                </div>
                <div style={{textAlign:"right"}}>
                  <span style={{fontSize:11,color:"#4a5270",marginRight:6}}>{a.oldMos>0?"+":""}{a.oldMos}%</span>
                  <span style={{fontSize:11,color:"#4a5270"}}>→</span>
                  <span style={{fontSize:12,fontWeight:700,color:mosColor(a.newMos),marginLeft:6}}>{a.newMos>0?"+":""}{a.newMos}%</span>
                  <span style={{fontSize:10,color:"#34d399",marginLeft:6}}>(+{a.improvement}pts)</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {view==="form"&&<div style={{maxWidth:640,margin:"0 auto 18px"}}><Form initial={editData||EMPTY} editingId={editingId} onSave={handleSave} onCancel={()=>{setEditData(null);setEditingId(null);setView("list");}} destWHT={destWHT}/></div>}

      {/* TABS */}
      <div style={{maxWidth:640,margin:"0 auto 14px",display:"flex",gap:0,background:"rgba(255,255,255,0.03)",borderRadius:10,padding:3,border:"1px solid rgba(255,255,255,0.06)"}}>
        {TABS.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{...BTN,flex:1,padding:"8px 0",fontSize:11,borderRadius:8,background:tab===t.id?"rgba(99,102,241,0.4)":"transparent",color:tab===t.id?"#fff":"#4a5270"}}>{t.label}</button>)}
      </div>

      <div style={{maxWidth:640,margin:"0 auto"}}>
        {tab==="index"&&(
          <div>
            {/* Sort selector */}
            <div style={{display:"flex",gap:4,marginBottom:10}}>
              {[["score","⭐ Mejor valoradas"],["rentable","💰 Más rentables"],["barata","🎯 Más baratas"],["divquality","💎 Mejor dividendo"]].map(([k,l])=>(
                <button key={k} onClick={()=>setSortBy(k)} style={{flex:1,border:"1px solid "+(sortBy===k?"rgba(99,102,241,0.5)":"rgba(255,255,255,0.06)"),borderRadius:8,padding:"6px 4px",fontSize:10,fontWeight:600,cursor:"pointer",background:sortBy===k?"rgba(99,102,241,0.25)":"rgba(255,255,255,0.03)",color:sortBy===k?"#818cf8":"#4a5270",fontFamily:"'Figtree',sans-serif",textAlign:"center"}}>{l}</button>
              ))}
            </div>
            {/* Search + filters */}
            <div style={{marginBottom:12}}>
              <input style={{...INP,marginBottom:8,fontSize:13}} placeholder="🔍 Buscar empresa..." value={search} onChange={e=>setSearch(e.target.value)}/>
              <div style={{display:"flex",gap:4,flexWrap:"wrap",alignItems:"center"}}>
                {[5,6,7,8].map(s=><button key={s} onClick={()=>setMinScore(minScore===s?0:s)} style={{border:"1px solid "+(minScore===s?"rgba(99,102,241,0.4)":"rgba(255,255,255,0.05)"),borderRadius:6,padding:"3px 8px",fontSize:10,fontWeight:600,cursor:"pointer",background:minScore===s?"rgba(99,102,241,0.35)":"rgba(255,255,255,0.04)",color:minScore===s?"#818cf8":"#4a5270",fontFamily:"'Figtree',sans-serif"}}>{"≥"+s}</button>)}
                <span style={{color:"rgba(255,255,255,0.07)"}}>|</span>
                {availableSectors.map(sk=>{const s=SECTORS[sk]||SECTORS.general;return(<button key={sk} onClick={()=>setFilterSector(filterSector===sk?null:sk)} style={{border:"1px solid "+(filterSector===sk?s.color+"50":"rgba(255,255,255,0.05)"),borderRadius:6,padding:"3px 8px",fontSize:10,fontWeight:600,cursor:"pointer",background:filterSector===sk?s.color+"20":"rgba(255,255,255,0.04)",color:filterSector===sk?s.color:"#4a5270",fontFamily:"'Figtree',sans-serif"}}>{s.label}</button>);})}
                {(search||minScore>0||filterSector)&&<button onClick={()=>{setSearch("");setMinScore(0);setFilterSector(null);}} style={{border:"none",borderRadius:6,padding:"3px 8px",fontSize:10,fontWeight:600,cursor:"pointer",background:"rgba(248,113,113,0.1)",color:"#f87171",fontFamily:"'Figtree',sans-serif"}}>✕</button>}
              </div>
              {filtered.length!==companies.length&&<p style={{fontSize:10,color:"#4a5270",marginTop:5}}>{filtered.length} de {companies.length}</p>}
            </div>
            {companies.length===0?(
              <div style={{textAlign:"center",padding:"60px 20px"}}><p style={{fontSize:36,marginBottom:12}}>📊</p><p style={{color:"#4a5270",fontSize:14}}>Tu índice está vacío.</p><p style={{color:"#2a3045",fontSize:12,marginTop:6}}>Pulsa "+ Añadir" para empezar.</p></div>
            ):(
              <div style={{display:"grid",gap:3}}>
                {sorted.map((co,i)=><CompanyRow key={co.id} co={co} rank={i+1} total={sorted.length} sortBy={sortBy} sel={selected?.id===co.id} onSel={()=>setDetailCo(co)} onEdit={()=>handleEdit(co)} onDel={()=>handleDelete(co.id)} compareList={compareList} onCompare={toggleCompare} destWHT={destWHT}/>)}
              </div>
            )}
          </div>
        )}

        {tab==="sectores"&&<GroupedRanking groups={bySector} getLabel={k=>{const s=SECTORS[k]||SECTORS.general;return{name:s.label,flag:"" };}} getColor={k=>(SECTORS[k]||SECTORS.general).color} emptyMsg="Añade empresas para ver el ranking por sector."/>}
        {tab==="paises"&&<GroupedRanking groups={byCountry} getLabel={k=>getCountry(k)} getColor={()=>"#818cf8"} emptyMsg="Añade empresas para ver el ranking geográfico."/>}

        {tab==="comparar"&&(
          <div>
            <div style={{marginBottom:16}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <p style={{fontSize:10,color:"#4a5270",letterSpacing:"0.12em",textTransform:"uppercase"}}>Selecciona hasta 5 · {compareList.length}/5</p>
                {compareList.length>0&&<button onClick={()=>setCompareList([])} style={{border:"none",borderRadius:6,padding:"3px 10px",fontSize:10,cursor:"pointer",background:"rgba(248,113,113,0.1)",color:"#f87171",fontFamily:"'Figtree',sans-serif"}}>✕ Limpiar</button>}
              </div>
              <CompareSelector companies={companies} compareList={compareList} toggleCompare={toggleCompare}/>
            </div>
            {compareCompanies.length>=2&&(
              <div>
                <div style={{height:1,background:"rgba(255,255,255,0.05)",marginBottom:16}}/>
                <MultiRadar companies={compareCompanies}/>
                <div style={{display:"grid",gap:6,marginTop:14}}>
                  {compareCompanies.map((co,i)=>{
                    const col=CC[i];
                    return(
                      <div key={co.id} style={{background:"rgba(255,255,255,0.02)",border:"1px solid "+col+"40",borderRadius:10,padding:"10px 14px"}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                          <div style={{display:"flex",alignItems:"center",gap:8}}><div style={{width:10,height:10,borderRadius:"50%",background:col}}/><span style={{fontSize:13,fontWeight:700,color:col}}>{co.name}</span></div>
                          <span style={{fontSize:18,fontWeight:800,color:sC(co.total)}}>{co.total.toFixed(1)}</span>
                        </div>
                        {co.dcf?.iv&&<p style={{fontSize:11,color:sC(co.scores?.margin_safety)}}>IV {co.dcf.iv} · MoS {co.dcf.mos>0?"+":""}{co.dcf.mos}%</p>}
                        {co.thesis&&<p style={{fontSize:10,color:"#5a6480",fontStyle:"italic",marginTop:4}}>{co.thesis.substring(0,80)}{co.thesis.length>80?"...":""}</p>}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
            {compareCompanies.length<2&&compareList.length>0&&<p style={{textAlign:"center",color:"#4a5270",fontSize:13,marginTop:20}}>Selecciona al menos 2 empresas.</p>}
          </div>
        )}
      </div>
      <p style={{textAlign:"center",fontSize:10,color:"#1a2030",marginTop:28,maxWidth:640,margin:"28px auto 0"}}>Mi Índice DGI · Exporta regularmente para hacer copias de seguridad</p>
    </React.Fragment>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script></body></html>
