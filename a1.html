function getCountry(code){ return COUNTRIES.find(c=>c.code===code)||{code:"OTHER",flag:"🌍",name:"Otro"}; }

function scoreColor(s){if(s==null)return"#3a4260";if(s>=8)return"#34d399";if(s>=6.5)return"#86efac";if(s>=5)return"#fbbf24";if(s>=3)return"#f97316";return"#f87171";}
function scoreBg(s){if(s==null)return"rgba(42,48,69,0.4)";if(s>=8)return"rgba(52,211,153,0.13)";if(s>=6.5)return"rgba(134,239,172,0.1)";if(s>=5)return"rgba(251,191,36,0.1)";if(s>=3)return"rgba(249,115,22,0.1)";return"rgba(248,113,113,0.1)";}
function scoreLabel(s){if(!s)return"Sin datos";if(s>=8)return"Excelente";if(s>=6.5)return"Buena";if(s>=5)return"Aceptable";if(s>=3)return"Débil";return"Muy débil";}
function rankColor(rank,total,type){const top=Math.ceil(total*0.25),bot=Math.floor(total*0.75);if(rank<=top)return"#34d399";if(type==="portfolio"&&rank>bot)return"#f87171";return"#c8d0e0";}
function getMetrics(sector){return(SECTORS[sector]||SECTORS.general).metrics;}
function calcScores(values,sector){
  const metrics=getMetrics(sector);let total=0,count=0;const scores={};
  metrics.forEach(m=>{const v=values[m.id];if(v!==undefined&&v!==""){const s=m.score(v);if(s!==null){scores[m.id]=s;total+=s;count++;}}});
  return{scores,total:count>0?total/count:0,count};
}

async function fetchYahoo(ticker){
  // Try multiple endpoints and proxies
  const endpoints=[
    // Chart endpoint (most reliable, has price)
    "https://query1.finance.yahoo.com/v8/finance/chart/"+encodeURIComponent(ticker)+"?interval=1d&range=1d",
    // Quote endpoint (has dividend yield)
    "https://query1.finance.yahoo.com/v7/finance/quote?symbols="+encodeURIComponent(ticker)+"&lang=en",
  ];
  const proxies=[
    u=>"https://corsproxy.io/?"+u,                                      // no encoding
    u=>"https://api.allorigins.win/get?url="+encodeURIComponent(u),    // with encoding
    u=>"https://cors-proxy.htmldriven.com/?url="+encodeURIComponent(u),
  ];
  for(const proxy of proxies){
    try{
      // Try quote endpoint first for full data
      const quoteUrl=proxy(endpoints[1]);
      const res=await fetch(quoteUrl,{signal:AbortSignal.timeout(12000)});
      if(!res.ok) throw new Error("HTTP "+res.status);
      let json=await res.json();
      if(typeof json.contents==="string") json=JSON.parse(json.contents);
      const q=json?.quoteResponse?.result?.[0];
      if(q){
        return{
          price:q.regularMarketPrice??null,
          yieldPct:q.trailingAnnualDividendYield?(q.trailingAnnualDividendYield*100):null,
          dividendRate:q.trailingAnnualDividendRate??null,
          currency:q.currency??"",
          updated:new Date().toLocaleString("es-ES")
        };
      }
      // Fallback: chart endpoint (price only)
      const chartRes=await fetch(proxy(endpoints[0]),{signal:AbortSignal.timeout(12000)});
      if(!chartRes.ok) throw new Error("HTTP "+chartRes.status);
      let chartJson=await chartRes.json();
      if(typeof chartJson.contents==="string") chartJson=JSON.parse(chartJson.contents);
      const meta=chartJson?.chart?.result?.[0]?.meta;
      if(meta){
        return{
          price:meta.regularMarketPrice??null,
          yieldPct:null,
          dividendRate:null,
          currency:meta.currency??"",
          updated:new Date().toLocaleString("es-ES")
        };
      }
    }catch(e){ continue; }
  }
  throw new Error("No se pudo obtener datos para "+ticker+" — prueba a esperar unos segundos y reintentar");
}

function RadarChart({scores,sector,color}){
  const metrics=getMetrics(sector);
  const cx=120,cy=120,r=82,n=metrics.length;
  const pt=(i,rad)=>{const a=(Math.PI*2*i/n)-Math.PI/2;return[cx+rad*Math.cos(a),cy+rad*Math.sin(a)];};
  const poly=metrics.map((_,i)=>{const[x,y]=pt(i,(scores[metrics[i].id]||0)/10*r);return x+","+y;}).join(" ");
  return(
    <svg viewBox="0 0 240 240" style={{width:"100%",maxWidth:220,display:"block",margin:"0 auto"}}>
      {[2,4,6,8,10].map(l=><polygon key={l} points={Array.from({length:n},(_,i)=>pt(i,l/10*r).join(",")).join(" ")} fill="none" stroke="rgba(255,255,255,0.05)" strokeWidth="1"/>)}
      {Array.from({length:n},(_,i)=>{const[x,y]=pt(i,r);return<line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke="rgba(255,255,255,0.06)" strokeWidth="1"/>;} )}
      <polygon points={poly} fill={color} fillOpacity="0.15" stroke={color} strokeWidth="2"/>
      {metrics.map((m,i)=>{const[x,y]=pt(i,r+14);return<text key={i} x={x} y={y} textAnchor="middle" dominantBaseline="middle" fontSize="7" fill="#4a5270" fontFamily="Inter,sans-serif">{m.short}</text>;})}
      {metrics.map((m,i)=>{const[x,y]=pt(i,(scores[m.id]||0)/10*r);return<circle key={i} cx={x} cy={y} r="2.5" fill={color}/>;} )}
    </svg>
  );
}

    <div style={{background:"rgba(255,255,255,0.025)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:16,padding:"20px 16px"}}>
      <p style={{margin:"0 0 14px",fontSize:10,color:"#4a5270",letterSpacing:"0.16em",textTransform:"uppercase",fontWeight:600}}>{editingId?"Editando empresa":"Nueva empresa"}</p>
      <div style={{display:"flex",gap:0,marginBottom:14,borderRadius:10,overflow:"hidden",border:"1px solid rgba(255,255,255,0.07)",width:"fit-content"}}>
        {["portfolio","watchlist"].map(t=>(
          <button key={t} onClick={()=>setForm(f=>({...f,type:t}))} style={{...BTN,borderRadius:0,padding:"7px 16px",fontSize:12,background:form.type===t?"rgba(99,102,241,0.5)":"transparent",color:form.type===t?"#fff":"#4a5270"}}>
            {t==="portfolio"?"En cartera":"Candidata"}
          </button>
        ))}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
        <div><label style={{display:"block",fontSize:10,color:"#4a5270",marginBottom:5,textTransform:"uppercase",letterSpacing:"0.1em"}}>Nombre</label><input style={INP} placeholder="ej: Munich Re" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/></div>
        <div><label style={{display:"block",fontSize:10,color:"#4a5270",marginBottom:5,textTransform:"uppercase",letterSpacing:"0.1em"}}>Ticker</label><input style={INP} placeholder="ej: MUV2" value={form.ticker} onChange={e=>setForm(f=>({...f,ticker:e.target.value}))}/></div>
      </div>
      <div style={{marginBottom:10}}>
        <label style={{display:"block",fontSize:10,color:"#4a5270",marginBottom:6,textTransform:"uppercase",letterSpacing:"0.1em"}}>País</label>
        <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
          {COUNTRIES.map(c=>(
            <button key={c.code} onClick={()=>setForm(f=>({...f,country:c.code}))}
              style={{...BTN,padding:"5px 10px",fontSize:11,background:form.country===c.code?"rgba(99,102,241,0.4)":"rgba(255,255,255,0.04)",color:form.country===c.code?"#fff":"#5a6480",border:"1px solid "+(form.country===c.code?"rgba(99,102,241,0.5)":"rgba(255,255,255,0.06)"),borderRadius:8}}>
              {c.flag} {c.name}
            </button>
          ))}
        </div>
      </div>
      <div style={{marginBottom:14}}>
        <label style={{display:"block",fontSize:10,color:"#4a5270",marginBottom:6,textTransform:"uppercase",letterSpacing:"0.1em"}}>Sector</label>
        <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
          {Object.entries(SECTORS).map(([k,s])=>(
            <button key={k} onClick={()=>changeSector(k)}
              style={{...BTN,padding:"6px 12px",fontSize:11,background:form.sector===k?s.color+"25":"rgba(255,255,255,0.04)",color:form.sector===k?s.color:"#5a6480",border:"1px solid "+(form.sector===k?s.color+"50":"rgba(255,255,255,0.06)"),borderRadius:8}}>
              {s.label}
            </button>
          ))}
        </div>
        <p style={{fontSize:11,color:"#3a4260",marginTop:5,fontStyle:"italic"}}>{sc.desc}</p>
      </div>
      <div style={{display:"grid",gap:7}}>
        {metrics.map(m=>{
          const s=live.scores[m.id];const has=form.values[m.id]!==undefined&&form.values[m.id]!=="";
          return(
            <div key={m.id} style={{padding:"10px 12px",background:"rgba(255,255,255,0.02)",border:"1px solid "+(has?scoreColor(s)+"30":"rgba(255,255,255,0.04)"),borderRadius:9}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}>
                    <span style={{fontSize:12,color:"#8090a8",fontWeight:500}}>{m.label}</span>
                    {m.autoFetch&&<span style={{fontSize:9,color:"#818cf8",background:"rgba(99,102,241,0.1)",padding:"1px 5px",borderRadius:3}}>Yahoo</span>}
                    <button style={{background:"none",border:"1px solid rgba(255,255,255,0.08)",borderRadius:"50%",color:"#4a5270",width:15,height:15,fontSize:8,cursor:"pointer",padding:0,lineHeight:"15px"}} onClick={()=>setOpenHint(openHint===m.id?null:m.id)}>?</button>
                  </div>
                  {openHint===m.id&&<p style={{fontSize:11,color:"#4a5270",fontStyle:"italic",marginBottom:3}}>{m.hint}</p>}
                  {!m.skipRanges&&<button style={{background:"none",border:"none",color:"#2a3a55",fontSize:10,cursor:"pointer",padding:0}} onClick={()=>setShowRanges(showRanges===m.id?null:m.id)}>{showRanges===m.id?"ocultar rangos":"ver rangos"}</button>}
                  {m.skipRanges&&<p style={{fontSize:10,color:"#2a3050"}}>Bell curve: óptimo 4-5% | bueno 3-6% | alto riesgo &gt;10%</p>}
                  {!m.skipRanges&&showRanges===m.id&&(
                    <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:3,marginTop:6}}>
                      {m.ranges.map((r,i)=>(
                        <div key={i} style={{background:scoreBg(10-i),borderRadius:5,padding:"3px 2px",textAlign:"center",display:"flex",flexDirection:"column",gap:1}}>
                          <span style={{fontFamily:"'Syne',sans-serif",fontSize:11,fontWeight:800,color:scoreColor(10-i)}}>{10-i}</span>
                          <span style={{fontSize:9,color:scoreColor(10-i),opacity:0.75}}>{r}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
                <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
                  <div style={{position:"relative"}}>
                    <input style={{...INP,width:80,padding:"7px 28px 7px 8px",fontSize:14}} type="number" step="any" placeholder={m.placeholder} value={form.values[m.id]??""} onChange={e=>setVal(m.id,e.target.value)}/>
                    <span style={{position:"absolute",right:6,top:"50%",transform:"translateY(-50%)",fontSize:10,color:"#3a4260",pointerEvents:"none"}}>{m.unit}</span>
                  </div>
                  <div style={{width:30,height:30,borderRadius:7,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Syne',sans-serif",fontSize:13,fontWeight:700,flexShrink:0,background:scoreBg(s),color:scoreColor(s),opacity:has?1:0.25}}>{has?(s!=null?s:"—"):"—"}</div>
                </div>
              </div>
            </div>
          );
        })}
      </div>
      {live.count>0&&(
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:16,padding:"14px 18px",borderRadius:12,border:"1px solid "+scoreColor(live.total)+"40",background:scoreBg(live.total)}}>
          <div>
            <p style={{fontSize:11,color:"#4a5270"}}>Nota media — {live.count}/{metrics.length} métricas</p>
            <p style={{fontSize:11,color:"#4a5270",fontStyle:"italic",marginTop:2}}>{scoreLabel(live.total)}</p>
          </div>
          <span style={{fontFamily:"'Syne',sans-serif",fontSize:38,fontWeight:800,color:scoreColor(live.total)}}>{live.total.toFixed(1)}</span>
        </div>
      )}
      <div style={{display:"flex",gap:10,marginTop:14}}>
        <button onClick={()=>onSave(form)} disabled={!form.name.trim()} style={{...BTN,flex:1,background:"rgba(99,102,241,0.8)",opacity:!form.name.trim()?0.4:1}}>{editingId?"Guardar cambios":"Añadir al índice"}</button>
        <button onClick={onCancel} style={{...BTN,background:"rgba(255,255,255,0.05)"}}>Cancelar</button>
      </div>
    </div>
  );
}

const EMPTY={name:"",ticker:"",type:"portfolio",sector:"general",country:"US",values:{}};

function App(){
  const[companies,setCompanies]=useState([]);
  const[tab,setTab]=useState("index");
  const[view,setView]=useState("list");
  const[editData,setEditData]=useState(null);
  const[editingId,setEditingId]=useState(null);
  const[selected,setSelected]=useState(null);
  const[refreshing,setRefreshing]=useState(false);
  const[refreshMsg,setRefreshMsg]=useState("");
  const fileRef=useRef();

  useEffect(()=>{try{const s=localStorage.getItem("dgi-v5");if(s)setCompanies(JSON.parse(s));}catch(e){};},[]);
  function persist(l){try{localStorage.setItem("dgi-v5",JSON.stringify(l));}catch(e){}}

  function handleSave(form){
    const{scores,total,count}=calcScores(form.values,form.sector);
    const c={id:editingId||Date.now().toString(),name:form.name.trim(),ticker:form.ticker.trim().toUpperCase(),type:form.type,sector:form.sector||"general",country:form.country||"US",values:{...form.values},scores,total:parseFloat(total.toFixed(2)),count,date:new Date().toLocaleDateString("es-ES"),liveData:null};
    const nl=editingId?companies.map(x=>x.id===editingId?{...c,liveData:x.liveData}:x):[...companies,c];
    nl.sort((a,b)=>b.total-a.total);setCompanies(nl);persist(nl);setEditData(null);setEditingId(null);setView("list");setSelected(c);
  }
  function handleEdit(c){setEditData({...c,values:{...c.values}});setEditingId(c.id);setTab("index");setView("form");setSelected(null);}
  function handleDelete(id){if(!confirm("¿Eliminar esta empresa?"))return;const nl=companies.filter(c=>c.id!==id);setCompanies(nl);persist(nl);if(selected&&selected.id===id)setSelected(null);}
  function handleExport(){const blob=new Blob([JSON.stringify({version:5,exportDate:new Date().toISOString(),companies},null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="mi-indice-dgi.json";a.click();URL.revokeObjectURL(url);}
  function handleImport(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const data=JSON.parse(ev.target.result);const list=data.companies||data;if(!Array.isArray(list))throw new Error("Formato incorrecto");if(confirm("Importar "+list.length+" empresas? Se reemplazarán los datos actuales.")){list.sort((a,b)=>b.total-a.total);setCompanies(list);persist(list);setSelected(null);}}catch(err){alert("Error: "+err.message);}};reader.readAsText(file);e.target.value="";}

  async function handleRefresh(){
    const withTicker=companies.filter(c=>c.ticker);
    if(withTicker.length===0){setRefreshMsg("Ninguna empresa tiene ticker asignado.");return;}
    setRefreshing(true);setRefreshMsg("Actualizando "+withTicker.length+" empresas...");
    let ok=0,fail=0;
    const updated=[...companies];
    await Promise.all(withTicker.map(async c=>{
      try{
        const ld=await fetchYahoo(c.ticker);
        const idx=updated.findIndex(x=>x.id===c.id);
        if(idx>=0){
          const newValues={...updated[idx].values};
          if(ld.yieldPct!=null)newValues["yield_pct"]=ld.yieldPct.toFixed(2);
          const{scores,total,count}=calcScores(newValues,updated[idx].sector);
          updated[idx]={...updated[idx],values:newValues,scores,total:parseFloat(total.toFixed(2)),count,liveData:ld};
        }
        ok++;
      }catch(err){fail++;}
    }));
    updated.sort((a,b)=>b.total-a.total);
    setCompanies(updated);persist(updated);setRefreshing(false);
    setRefreshMsg("✓ "+ok+" actualizadas"+(fail>0?" · "+fail+" fallidas — revisa el ticker":"")+".");
    setTimeout(()=>setRefreshMsg(""),6000);
  }

  const portfolio=useMemo(()=>companies.filter(c=>c.type==="portfolio").sort((a,b)=>b.total-a.total),[companies]);
  const watchlist=useMemo(()=>companies.filter(c=>c.type==="watchlist"||!c.type).sort((a,b)=>b.total-a.total),[companies]);
  const avgP=portfolio.length?portfolio.reduce((a,b)=>a+b.total,0)/portfolio.length:0;
  const rotAlert=useMemo(()=>{if(portfolio.length<2||watchlist.length<1)return null;const worst=portfolio[portfolio.length-1],best=watchlist[0];return best.total-worst.total>=2?{worst,best}:null;},[portfolio,watchlist]);

  const bySector=useMemo(()=>{const g={};companies.forEach(c=>{const s=c.sector||"general";if(!g[s])g[s]=[];g[s].push(c);});Object.values(g).forEach(a=>a.sort((a,b)=>b.total-a.total));return g;},[companies]);
  const byCountry=useMemo(()=>{const g={};companies.forEach(c=>{const ct=c.country||"OTHER";if(!g[ct])g[ct]=[];g[ct].push(c);});Object.values(g).forEach(a=>a.sort((a,b)=>b.total-a.total));return g;},[companies]);

  const TABS=[{id:"index",label:"Índice"},{id:"sectores",label:"Sectores"},{id:"paises",label:"Países"}];

  return(
    <div style={{minHeight:"100vh",padding:"20px 16px 80px",backgroundImage:"radial-gradient(ellipse at 70% 0%, rgba(60,30,140,0.14) 0%, transparent 50%)"}}>
      <div style={{maxWidth:640,margin:"0 auto 18px",display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
        <div>
          <p style={{fontSize:10,letterSpacing:"0.25em",color:"#818cf8",textTransform:"uppercase",marginBottom:3,fontWeight:500}}>DGI · Scoring System</p>
          <h1 style={{fontFamily:"'Syne',sans-serif",fontSize:28,fontWeight:800,color:"#fff",letterSpacing:"-0.02em",lineHeight:1}}>Mi Índice</h1>
        </div>
        <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
          {portfolio.length>0&&<div style={{display:"flex",gap:8,alignItems:"center",padding:"5px 10px",background:"rgba(255,255,255,0.03)",borderRadius:8,border:"1px solid rgba(255,255,255,0.05)"}}><span style={{fontSize:10,color:"#3a4260"}}>{portfolio.length} en cartera</span><span style={{fontFamily:"'Syne',sans-serif",fontSize:16,fontWeight:800,color:scoreColor(avgP)}}>{"Ø"+avgP.toFixed(1)}</span></div>}
          <div style={{display:"flex",gap:5,flexWrap:"wrap",justifyContent:"flex-end"}}>
            <button onClick={handleRefresh} disabled={refreshing} style={{...BTN,fontSize:11,padding:"6px 10px",background:"rgba(99,102,241,0.15)",color:"#818cf8",opacity:refreshing?0.5:1}}>{refreshing?"⏳ Actualizando...":"↺ Yahoo Finance"}</button>
            <button onClick={handleExport} disabled={companies.length===0} style={{...BTN,fontSize:11,padding:"6px 10px",background:"rgba(255,255,255,0.05)",color:"#6a7090",opacity:companies.length===0?0.3:1}}>Exportar</button>
            <button onClick={()=>fileRef.current.click()} style={{...BTN,fontSize:11,padding:"6px 10px",background:"rgba(255,255,255,0.05)",color:"#6a7090"}}>Importar</button>
            <input ref={fileRef} type="file" accept=".json" onChange={handleImport}/>
            <button onClick={()=>{setEditData(EMPTY);setEditingId(null);setTab("index");setView(view==="form"?"list":"form");}} style={{...BTN,fontSize:12,padding:"7px 12px",background:view==="form"?"rgba(255,255,255,0.06)":"rgba(99,102,241,0.8)"}}>{view==="form"?"Cancelar":"+ Añadir"}</button>
          </div>
        </div>
      </div>

      {refreshMsg&&<div style={{maxWidth:640,margin:"0 auto 14px",padding:"8px 14px",background:"rgba(99,102,241,0.08)",border:"1px solid rgba(99,102,241,0.2)",borderRadius:10,fontSize:12,color:"#818cf8"}}>{refreshMsg}</div>}

      {view==="form"&&<div style={{maxWidth:640,margin:"0 auto 20px"}}><Form initial={editData||EMPTY} editingId={editingId} onSave={handleSave} onCancel={()=>{setEditData(null);setEditingId(null);setView("list");}}/></div>}

      <div style={{maxWidth:640,margin:"0 auto 20px",display:"flex",gap:0,background:"rgba(255,255,255,0.03)",borderRadius:10,padding:3,border:"1px solid rgba(255,255,255,0.06)"}}>
        {TABS.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{...BTN,flex:1,padding:"8px 0",fontSize:12,borderRadius:8,background:tab===t.id?"rgba(99,102,241,0.4)":"transparent",color:tab===t.id?"#fff":"#4a5270"}}>{t.label}</button>)}
      </div>

      <div style={{maxWidth:640,margin:"0 auto"}}>
        {tab==="index"&&(
          companies.length===0?(
            <div style={{textAlign:"center",padding:"60px 20px"}}><p style={{fontSize:36,marginBottom:12}}>📊</p><p style={{color:"#4a5270",fontSize:14}}>Tu índice está vacío.</p><p style={{color:"#2a3045",fontSize:12,marginTop:6}}>Pulsa “+ Añadir” para empezar.</p></div>
          ):(
            <>
              {portfolio.length>0&&<>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                  <div><p style={{margin:0,fontSize:10,color:"#4a5270",letterSpacing:"0.16em",textTransform:"uppercase",fontWeight:600}}>Cartera actual</p>
                  <div style={{display:"flex",gap:10,marginTop:4}}>{[{l:"Q1 top 25%",c:"#34d399"},{l:"Q2-Q3",c:"#c8d0e0"},{l:"Q4 peor 25%",c:"#f87171"}].map(x=><span key={x.l} style={{fontSize:10,color:x.c,opacity:0.8}}>{"● "+x.l}</span>)}</div></div>
                  <span style={{fontSize:11,color:"#2a3045"}}>{portfolio.length} empresas</span>
                </div>
                <div style={{display:"grid",gap:7,marginBottom:8}}>
                  {portfolio.map((c,i)=><CompanyRow key={c.id} company={c} rank={i+1} total={portfolio.length} type="portfolio" selected={selected&&selected.id===c.id} onSelect={()=>setSelected(selected&&selected.id===c.id?null:c)} onEdit={()=>handleEdit(c)} onDelete={()=>handleDelete(c.id)}/>)}
                </div>
              </>}
              {portfolio.length>0&&watchlist.length>0&&<div style={{margin:"28px 0 22px",display:"flex",alignItems:"center",gap:12}}><div style={{flex:1,height:1,background:"rgba(255,255,255,0.05)"}}/><span style={{fontSize:11,color:"#2a3045",letterSpacing:"0.15em",textTransform:"uppercase",flexShrink:0}}>Candidatas al índice</span><div style={{flex:1,height:1,background:"rgba(255,255,255,0.05)"}}/></div>}
              {watchlist.length>0&&<>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                  <div style={{display:"flex",gap:10}}>{[{l:"Top 25%",c:"#34d399"},{l:"Resto",c:"#c8d0e0"}].map(x=><span key={x.l} style={{fontSize:10,color:x.c,opacity:0.8}}>{"● "+x.l}</span>)}</div>
                  <span style={{fontSize:11,color:"#2a3045"}}>{watchlist.length} candidatas</span>
                </div>
                <div style={{display:"grid",gap:7}}>
                  {watchlist.map((c,i)=><CompanyRow key={c.id} company={c} rank={i+1} total={watchlist.length} type="watchlist" selected={selected&&selected.id===c.id} onSelect={()=>setSelected(selected&&selected.id===c.id?null:c)} onEdit={()=>handleEdit(c)} onDelete={()=>handleDelete(c.id)}/>)}
                </div>
              </>}
              {rotAlert&&<div style={{marginTop:20,background:"rgba(251,191,36,0.06)",border:"1px solid rgba(251,191,36,0.15)",borderRadius:12,padding:"12px 16px"}}><p style={{fontSize:12,color:"#fbbf24",fontWeight:600,marginBottom:4}}>Candidata a rotación</p><p style={{fontSize:12,color:"#7a6030",lineHeight:1.5}}><strong style={{color:"#f87171"}}>{rotAlert.worst.name} ({rotAlert.worst.total.toFixed(1)})</strong>{" tiene 2+ puntos menos que la candidata "}<strong style={{color:"#34d399"}}>{rotAlert.best.name} ({rotAlert.best.total.toFixed(1)})</strong>.</p></div>}
            </>
          )
        )}

        {tab==="sectores"&&(
          <GroupedRanking groups={bySector}
            getLabel={k=>{const s=SECTORS[k]||SECTORS.general;return{name:s.label,flag:""};}}
            getColor={k=>(SECTORS[k]||SECTORS.general).color}
            emptyMsg="Añade empresas para ver el ranking por sector."/>
        )}

        {tab==="paises"&&(
          <GroupedRanking groups={byCountry}
            getLabel={k=>getCountry(k)}
            getColor={()=>"#c8d0e0"}
            emptyMsg="Añade empresas con país para ver el ranking geográfico."/>
        )}
      </div>

      <p style={{textAlign:"center",fontSize:10,color:"#1a2030",marginTop:28,maxWidth:640,margin:"28px auto 0"}}>
        Mi Índice DGI · Exporta regularmente para hacer copias de seguridad
      </p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
